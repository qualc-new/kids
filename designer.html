<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>小小设计师</title>
  <style>
    :root {
      --bg: #ffffff; --paper: #f4f8fc; --ink: #2c3e50; --muted: #6b7c8f;
      --line: #c5d5e8; --red: #ff7a1a; --ok: #2bb673; --btn-ink: #fff;
    }
    * { box-sizing: border-box; }
    html, body {
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-text-size-adjust: 100%; touch-action: manipulation;
    }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 6%, #e3f0ff 0, transparent 26%),
        radial-gradient(circle at 92% 10%, #dff0ff 0, transparent 24%),
        radial-gradient(circle at 80% 95%, #fff3c9 0, transparent 28%),
        var(--bg);
      padding: 20px 16px 32px;
    }
    .wrap { max-width: 860px; margin: 0 auto; position: relative; z-index: 1; }
    a.home {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px; background: #fff;
      border: 2px solid var(--line); color: var(--red);
      font-size: 13px; font-weight: 700; text-decoration: none;
    }
    h1 { margin: 8px 0 6px; font-size: 28px; font-weight: 800; color: var(--red); letter-spacing: 0.5px; }
    .road-line {
      height: 7px; margin: 0 0 12px; border-radius: 999px;
      background: repeating-linear-gradient(90deg, #ffd166 0 12px, transparent 12px 22px), #4a5568;
      border: 2px solid #4a5568;
    }
    .lead { margin: 0 0 14px; color: var(--muted); font-size: 15px; line-height: 1.5; }
    .stage {
      background: #fff; border: 3px solid var(--line); border-radius: 24px;
      padding: 18px 16px 28px; box-shadow: 0 8px 0 #d4e4f7; position: relative;
    }
    .stage::before, .stage::after {
      content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%;
      background: #2c3e50; border: 3px solid #94a3b8; z-index: 2; bottom: 8px;
    }
    .stage::before { left: 8px; }
    .stage::after { right: 8px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .chip, button {
      border: 3px solid var(--line); background: #fff; color: var(--ink);
      border-radius: 999px; font: inherit; font-weight: 700; cursor: pointer;
      padding: 9px 16px; box-shadow: 0 4px 0 #b8cce0;
    }
    .chip.active, button.primary {
      background: var(--red); border-color: var(--red); color: var(--btn-ink); box-shadow: 0 4px 0 #d9650a;
    }
    .chip:active, button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #b8cce0; }
    .stage-card { background: #fff8ee; border-radius: 18px; overflow: hidden; margin-bottom: 14px; }
    canvas { display: block; margin: 0 auto; touch-action: none; cursor: crosshair; width: 100%; max-width: 320px; height: auto; }
    .block { margin-bottom: 12px; }
    .label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; }
    .swatch {
      width: 32px; height: 32px; padding: 0; border-radius: 50%; border: 3px solid #fff;
      box-shadow: 0 0 0 2px var(--line); cursor: pointer;
    }
    .swatch.on { box-shadow: 0 0 0 3px var(--red); }
    .bar { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
    .status {
      margin: 14px 0 0; font-size: 15px; font-weight: 600; min-height: 22px;
      padding: 8px 12px; border-radius: 12px; border: 2px solid transparent; color: var(--muted);
    }
    .status.ok { color: #187a4c; background: #d8f5e5; border-color: #2bb673; font-weight: 800; }
    .status.bad { color: #c62828; background: #fde8e8; border-color: #e53935; font-weight: 800; }
    .car-deco { position: fixed; width: 64px; height: 40px; pointer-events: none; opacity: 0.85; z-index: 0; }
    .car-deco-tl { top: 10px; left: 8px; }
    .car-deco-tr { top: 14px; right: 10px; transform: scaleX(-1); }
  </style>
</head>
<body>
  <svg class="car-deco car-deco-tl" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="16" width="52" height="14" rx="5" fill="#1e88e5"/><path d="M14 16l7-9h20l9 9z" fill="#1e88e5"/><circle cx="20" cy="31" r="5" fill="#2c3e50"/><circle cx="44" cy="31" r="5" fill="#2c3e50"/></svg>
  <svg class="car-deco car-deco-tr" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="14" width="44" height="16" rx="3" fill="#ff7a1a"/><rect x="12" y="8" width="22" height="8" rx="2" fill="#ff9a4d"/><circle cx="18" cy="32" r="5" fill="#2c3e50"/><circle cx="40" cy="32" r="5" fill="#2c3e50"/><rect x="48" y="18" width="10" height="8" fill="#ffd166"/></svg>
  <div class="wrap">
    <a class="home" href="index.html"><svg width="26" height="16" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="16" width="52" height="14" rx="5" fill="#ff7a1a"/><path d="M14 16l7-9h20l9 9z" fill="#ff7a1a"/><circle cx="20" cy="31" r="5" fill="#2c3e50"/><circle cx="44" cy="31" r="5" fill="#2c3e50"/></svg> 回家园</a>
    <h1>小小设计师</h1>
    <div class="road-line" aria-hidden="true"></div>
    <p class="lead">给毛衣设计花纹，尽量让花纹有规律（同一种形状或颜色按顺序重复）。正面和背面都要画。</p>
    <div class="stage">
      <div class="tabs">
        <button type="button" class="chip active" id="tabFront">正面</button>
        <button type="button" class="chip" id="tabBack">背面</button>
      </div>
      <div class="stage-card">
        <canvas id="sweater" width="320" height="380"></canvas>
      </div>
      <div class="block">
        <span class="label">颜色</span>
        <div class="row" id="colors"></div>
      </div>
      <div class="block">
        <span class="label">工具</span>
        <div class="row">
          <button type="button" class="chip active" data-tool="brush">画笔</button>
          <button type="button" class="chip" data-tool="dot">圆点</button>
          <button type="button" class="chip" data-tool="heart">爱心</button>
          <button type="button" class="chip" data-tool="eraser">橡皮</button>
        </div>
      </div>
      <div class="block">
        <span class="label">一键规律花纹</span>
        <div class="row">
          <button type="button" id="hstripe">横条纹</button>
          <button type="button" id="vstripe">竖条纹</button>
          <button type="button" id="dots">圆点阵</button>
        </div>
      </div>
      <div class="bar">
        <button type="button" id="clear">清空这面</button>
        <button type="button" class="primary" id="done">完成设计</button>
      </div>
      <p class="status" id="status">花纹有规律，就是同一种形状按顺序重复。正面和背面都可以画。</p>
    </div>
  </div>
  <script>
    (function () {
      const COLORS = ["#e11d48", "#ff7a1a", "#eab308", "#2bb673", "#1e88e5", "#7c3aed", "#2c3e50"];
      const canvas = document.getElementById("sweater");
      const ctx = canvas.getContext("2d");
      const strokes = { front: [], back: [] };
      const state = { face: "front", color: COLORS[1], tool: "brush", drawing: false };

      function setStatus(msg, kind) {
        const el = document.getElementById("status");
        el.textContent = msg;
        el.classList.remove("ok", "bad");
        if (kind === "ok" || kind === "bad") el.classList.add(kind);
      }
      function cur() { return strokes[state.face]; }
      function pos(ev) {
        var r = canvas.getBoundingClientRect();
        var src = ev.touches ? ev.touches[0] : ev;
        return {
          x: (src.clientX - r.left) * canvas.width / r.width,
          y: (src.clientY - r.top) * canvas.height / r.height
        };
      }
      function sweaterPath(c, w, h) {
        var cx = w / 2, top = h * 0.06;
        c.beginPath();
        c.moveTo(cx - w * 0.09, top + h * 0.08);
        c.quadraticCurveTo(cx, top - h * 0.01, cx + w * 0.09, top + h * 0.08);
        c.lineTo(cx + w * 0.12, top + h * 0.16);
        c.lineTo(cx + w * 0.26, top + h * 0.2);
        c.lineTo(cx + w * 0.42, top + h * 0.42);
        c.lineTo(cx + w * 0.3, top + h * 0.48);
        c.lineTo(cx + w * 0.2, top + h * 0.3);
        c.lineTo(cx + w * 0.2, top + h * 0.82);
        c.lineTo(cx - w * 0.2, top + h * 0.82);
        c.lineTo(cx - w * 0.2, top + h * 0.3);
        c.lineTo(cx - w * 0.3, top + h * 0.48);
        c.lineTo(cx - w * 0.42, top + h * 0.42);
        c.lineTo(cx - w * 0.26, top + h * 0.2);
        c.lineTo(cx - w * 0.12, top + h * 0.16);
        c.closePath();
      }
      function drawStamp(c, item) {
        c.fillStyle = item.color;
        if (item.kind === "dot") {
          c.beginPath(); c.arc(item.x, item.y, 8, 0, Math.PI * 2); c.fill();
          return;
        }
        c.beginPath(); c.arc(item.x - 5, item.y, 6, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.arc(item.x + 5, item.y, 6, 0, Math.PI * 2); c.fill();
        c.beginPath();
        c.moveTo(item.x - 11, item.y + 2);
        c.lineTo(item.x + 11, item.y + 2);
        c.lineTo(item.x, item.y + 16);
        c.closePath(); c.fill();
      }
      function drawItem(c, item) {
        if (item.type === "stamp") { drawStamp(c, item); return; }
        if (item.type === "pattern") {
          c.strokeStyle = item.color; c.fillStyle = item.color; c.lineWidth = 10;
          var w = canvas.width, h = canvas.height, x, y;
          if (item.mode === "hstripe") {
            for (y = 40; y < h; y += 28) { c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); }
          } else if (item.mode === "vstripe") {
            for (x = 24; x < w; x += 28) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); }
          } else {
            for (y = 48; y < h - 40; y += 28) {
              for (x = 40; x < w - 40; x += 28) {
                c.beginPath(); c.arc(x, y, 5, 0, Math.PI * 2); c.fill();
              }
            }
          }
          return;
        }
        var pts = item.points;
        if (!pts || pts.length < 2) return;
        c.strokeStyle = item.color;
        c.lineWidth = item.size || 8;
        c.lineCap = "round"; c.lineJoin = "round";
        c.beginPath(); c.moveTo(pts[0].x, pts[0].y);
        pts.forEach(function (p, i) { if (i) c.lineTo(p.x, p.y); });
        c.stroke();
      }
      function redraw() {
        var w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = "#fff7ed";
        ctx.fillRect(0, 0, w, h);
        ctx.save();
        sweaterPath(ctx, w, h);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.clip();
        cur().forEach(function (item) { drawItem(ctx, item); });
        ctx.restore();
        sweaterPath(ctx, w, h);
        ctx.strokeStyle = "#2c3e50";
        ctx.lineWidth = 3;
        ctx.stroke();
      }
      function onDown(ev) {
        ev.preventDefault();
        var p = pos(ev);
        if (state.tool === "dot" || state.tool === "heart") {
          cur().push({ type: "stamp", kind: state.tool, color: state.color, x: p.x, y: p.y });
          redraw();
          return;
        }
        state.drawing = true;
        cur().push({
          type: "path",
          color: state.tool === "eraser" ? "#ffffff" : state.color,
          size: state.tool === "eraser" ? 16 : 8,
          points: [p]
        });
        if (ev.pointerId != null && canvas.setPointerCapture) canvas.setPointerCapture(ev.pointerId);
      }
      function onMove(ev) {
        if (!state.drawing) return;
        ev.preventDefault();
        var last = cur()[cur().length - 1];
        if (!last || last.type !== "path") return;
        last.points.push(pos(ev));
        redraw();
      }
      function onUp() { state.drawing = false; }

      canvas.addEventListener("pointerdown", onDown);
      canvas.addEventListener("pointermove", onMove);
      canvas.addEventListener("pointerup", onUp);
      canvas.addEventListener("pointercancel", onUp);

      var colorBox = document.getElementById("colors");
      COLORS.forEach(function (c) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "swatch" + (c === state.color ? " on" : "");
        b.style.background = c;
        b.setAttribute("aria-label", "颜色");
        b.onclick = function () {
          state.color = c;
          Array.prototype.forEach.call(colorBox.children, function (el) { el.classList.remove("on"); });
          b.classList.add("on");
        };
        colorBox.appendChild(b);
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-tool]"), function (btn) {
        btn.onclick = function () {
          state.tool = btn.getAttribute("data-tool");
          Array.prototype.forEach.call(document.querySelectorAll("[data-tool]"), function (el) {
            el.classList.toggle("active", el === btn);
          });
        };
      });
      function fillPattern(mode) {
        cur().length = 0;
        cur().push({ type: "pattern", mode: mode, color: state.color });
        redraw();
      }
      document.getElementById("hstripe").onclick = function () { fillPattern("hstripe"); };
      document.getElementById("vstripe").onclick = function () { fillPattern("vstripe"); };
      document.getElementById("dots").onclick = function () { fillPattern("dots"); };
      document.getElementById("clear").onclick = function () {
        cur().length = 0;
        redraw();
        setStatus("这一面清空了，再画一组有规律的花纹吧。");
      };
      function switchFace(next) {
        state.face = next;
        document.getElementById("tabFront").classList.toggle("active", next === "front");
        document.getElementById("tabBack").classList.toggle("active", next === "back");
        redraw();
      }
      document.getElementById("tabFront").onclick = function () { switchFace("front"); };
      document.getElementById("tabBack").onclick = function () { switchFace("back"); };
      document.getElementById("done").onclick = function () {
        if (!strokes.front.length || !strokes.back.length) {
          setStatus("正面和背面都设计一下吧。", "bad");
          return;
        }
        setStatus("设计完成！记住花纹要有规律哦。", "ok");
      };
      redraw();
    })();
  </script>
</body>
</html>
