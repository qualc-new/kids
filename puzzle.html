<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>我爱玩拼图</title>
  <style>
    :root {
      --bg: #ffffff; --paper: #f4f8fc; --ink: #2c3e50; --muted: #6b7c8f;
      --line: #c5d5e8; --red: #ff7a1a; --ok: #2bb673; --btn-ink: #fff;
    }
    * { box-sizing: border-box; }
    html, body {
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-text-size-adjust: 100%; touch-action: manipulation;
    }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 6%, #e3f0ff 0, transparent 26%),
        radial-gradient(circle at 92% 10%, #dff0ff 0, transparent 24%),
        radial-gradient(circle at 80% 95%, #fff3c9 0, transparent 28%),
        var(--bg);
      padding: 20px 16px 32px;
    }
    .wrap { max-width: 860px; margin: 0 auto; position: relative; z-index: 1; }
    a.home {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px; background: #fff;
      border: 2px solid var(--line); color: var(--red);
      font-size: 13px; font-weight: 700; text-decoration: none;
    }
    h1 { margin: 8px 0 6px; font-size: 28px; font-weight: 800; color: var(--red); letter-spacing: 0.5px; }
    .road-line {
      height: 7px; margin: 0 0 12px; border-radius: 999px;
      background: repeating-linear-gradient(90deg, #ffd166 0 12px, transparent 12px 22px), #4a5568;
      border: 2px solid #4a5568;
    }
    .lead { margin: 0 0 14px; color: var(--muted); font-size: 15px; line-height: 1.5; }
    .stats { display: flex; gap: 20px; margin: 8px 0 14px; }
    .stat b { display: block; font-size: 26px; color: var(--red); font-weight: 800; }
    .stat span { color: var(--muted); font-size: 13px; }
    .stage {
      background: #fff; border: 3px solid var(--line); border-radius: 24px;
      padding: 18px 16px 28px; box-shadow: 0 8px 0 #d4e4f7; position: relative;
    }
    .stage::before, .stage::after {
      content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%;
      background: #2c3e50; border: 3px solid #94a3b8; z-index: 2; bottom: 8px;
    }
    .stage::before { left: 8px; }
    .stage::after { right: 8px; }
    .ask { margin: 0 0 12px; font-size: 18px; font-weight: 800; }
    .panel {
      background: var(--paper); border: 2px solid var(--line); border-radius: 16px;
      padding: 8px; text-align: center; margin-bottom: 10px;
    }
    .panel .label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
    .pair { display: flex; gap: 8px; align-items: stretch; margin-bottom: 12px; }
    .pair .panel { flex: 1; margin-bottom: 0; min-height: 110px; }
    .plus { display: grid; place-items: center; font-size: 22px; font-weight: 800; color: var(--red); }
    .ghost { background: #fff8ee; }
    .placeholder { color: #b0bec5; font-size: 13px; }
    .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .opt {
      border: 3px solid var(--line); background: #fff; border-radius: 18px;
      padding: 8px; cursor: pointer; box-shadow: 0 5px 0 #b8cce0; text-align: center;
    }
    .opt:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8cce0; }
    .opt.on { border-color: var(--red); }
    .opt.ok { border-color: var(--ok); background: #eef8f1; }
    .opt.bad { border-color: #e53935; background: #fdeeee; }
    .opt .num { display: block; font-weight: 800; color: var(--red); margin-bottom: 2px; }
    button {
      border: 3px solid var(--line); background: #fff; color: var(--ink);
      border-radius: 999px; font: inherit; font-weight: 700; cursor: pointer;
      padding: 9px 16px; box-shadow: 0 4px 0 #b8cce0;
    }
    button.primary { background: var(--red); border-color: var(--red); color: var(--btn-ink); box-shadow: 0 4px 0 #d9650a; }
    button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #b8cce0; }
    .bar { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .status {
      margin: 14px 0 0; font-size: 15px; font-weight: 600; min-height: 22px;
      padding: 8px 12px; border-radius: 12px; border: 2px solid transparent; color: var(--muted);
    }
    .status.ok { color: #187a4c; background: #d8f5e5; border-color: #2bb673; font-weight: 800; }
    .status.bad { color: #c62828; background: #fde8e8; border-color: #e53935; font-weight: 800; }
    .car-deco { position: fixed; width: 64px; height: 40px; pointer-events: none; opacity: 0.85; z-index: 0; }
    .car-deco-tl { top: 10px; left: 8px; }
    .car-deco-tr { top: 14px; right: 10px; transform: scaleX(-1); }
  </style>
</head>
<body>
  <svg class="car-deco car-deco-tl" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="16" width="52" height="14" rx="5" fill="#1e88e5"/><path d="M14 16l7-9h20l9 9z" fill="#1e88e5"/><circle cx="20" cy="31" r="5" fill="#2c3e50"/><circle cx="44" cy="31" r="5" fill="#2c3e50"/></svg>
  <svg class="car-deco car-deco-tr" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="14" width="44" height="16" rx="3" fill="#ff7a1a"/><rect x="12" y="8" width="22" height="8" rx="2" fill="#ff9a4d"/><circle cx="18" cy="32" r="5" fill="#2c3e50"/><circle cx="40" cy="32" r="5" fill="#2c3e50"/><rect x="48" y="18" width="10" height="8" fill="#ffd166"/></svg>
  <div class="wrap">
    <a class="home" href="index.html"><svg width="26" height="16" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="16" width="52" height="14" rx="5" fill="#ff7a1a"/><path d="M14 16l7-9h20l9 9z" fill="#ff7a1a"/><circle cx="20" cy="31" r="5" fill="#2c3e50"/><circle cx="44" cy="31" r="5" fill="#2c3e50"/></svg> 回家园</a>
    <h1>我爱玩拼图</h1>
    <div class="road-line" aria-hidden="true"></div>
    <p class="lead">先看完整图形，再从 ①—④ 里找出能和中间半块拼在一起的那一块。注意小细节。</p>
    <div class="stats">
      <div class="stat"><b id="q">1</b><span>第几题</span></div>
      <div class="stat"><b id="ok">0</b><span>答对</span></div>
    </div>
    <div class="stage">
      <p class="ask" id="ask">找出能拼上的那一块</p>
      <div class="panel">
        <span class="label">完整图形</span>
        <div id="full"></div>
      </div>
      <div class="pair">
        <div class="panel">
          <span class="label">中间图形</span>
          <div id="top"></div>
        </div>
        <div class="plus">+</div>
        <div class="panel ghost">
          <span class="label">缺的半块</span>
          <div id="pickedBox"><span class="placeholder">点下面的①—④</span></div>
        </div>
      </div>
      <div class="opts" id="opts"></div>
      <div class="bar">
        <button type="button" id="reset">重选</button>
        <button type="button" class="primary" id="next">下一题</button>
      </div>
      <p class="status" id="status">先看完整图形的条纹、轮子和翅膀。</p>
    </div>
  </div>
  <script>
    (function () {
      const NUMS = ["①", "②", "③", "④"];
      const PUZZLES = [
        { kind: "rocket", name: "火箭", target: 0, options: [1, 2, 0, 3], answer: 2 },
        { kind: "ship", name: "轮船", target: 0, options: [0, 1, 2, 3], answer: 0 },
        { kind: "train", name: "火车", target: 0, options: [2, 0, 1, 3], answer: 1 },
        { kind: "plane", name: "飞机", target: 0, options: [1, 2, 3, 0], answer: 3 },
      ];
      const state = { i: 0, picked: -1, lock: false, correct: 0, judged: false };

      function setStatus(msg, kind) {
        const el = document.getElementById("status");
        el.textContent = msg;
        el.classList.remove("ok", "bad");
        if (kind === "ok" || kind === "bad") el.classList.add(kind);
      }

      function rocket(v) {
        var fin = v === 1 ? "#16a34a" : v === 3 ? "#7c3aed" : "#2563eb";
        var band = v === 2 ? "#facc15" : "#1d4ed8";
        var bandH = v === 2 ? 10 : 6;
        var win = v === 3 ? "#fde68a" : "#bfdbfe";
        var star2 = v === 1 ? "" : '<rect x="44" y="86" width="8" height="8" fill="#fde047" transform="rotate(45 48 90)"/>';
        var fy = v === 3 ? 118 : 108;
        return '<polygon points="40,8 22,42 58,42" fill="#2563eb"/>' +
          '<rect x="28" y="42" width="24" height="66" fill="#f97316"/>' +
          '<circle cx="40" cy="58" r="6" fill="' + win + '" stroke="#1d4ed8" stroke-width="2"/>' +
          '<rect x="32" y="74" width="8" height="8" fill="#fde047" transform="rotate(45 36 78)"/>' +
          star2 +
          '<rect x="28" y="' + (104) + '" width="24" height="' + bandH + '" fill="' + band + '"/>' +
          '<polygon points="10,132 28,' + fy + ' 28,132" fill="' + fin + '"/>' +
          '<polygon points="70,132 52,' + fy + ' 52,132" fill="' + fin + '"/>';
      }
      function ship(v) {
        var hull = v === 2 ? "#0f766e" : "#16a34a";
        var stripe = v === 1 ? "#f97316" : "#1d4ed8";
        var stripeH = v === 3 ? 14 : 8;
        var chim = v === 3 ? "#2563eb" : "#ef4444";
        var a2y = v === 1 ? 92 : 72;
        var a1 = v === 2 ? "" : '<circle cx="24" cy="72" r="5" fill="#facc15"/>';
        return '<rect x="32" y="30" width="18" height="12" fill="#22c55e" stroke="#15803d"/>' +
          '<rect x="24" y="42" width="34" height="16" fill="#16a34a" stroke="#15803d"/>' +
          '<rect x="50" y="18" width="8" height="18" fill="' + chim + '"/>' +
          '<path d="M8 58h64c0 36-16 48-32 48S8 94 8 58z" fill="' + hull + '"/>' +
          a1 +
          '<circle cx="56" cy="' + a2y + '" r="5" fill="#facc15"/>' +
          '<rect x="8" y="96" width="64" height="' + stripeH + '" fill="' + stripe + '"/>';
      }
      function train(v) {
        var cab = v === 2 ? "#ea580c" : "#dc2626";
        var boiler = v === 3 ? "#f97316" : "#d6b48a";
        var wheel = v === 3 ? "#16a34a" : v === 2 ? "#eab308" : "#2563eb";
        return '<rect x="46" y="36" width="26" height="52" fill="' + cab + '" stroke="#7f1d1d"/>' +
          '<rect x="12" y="56" width="38" height="32" rx="10" fill="' + boiler + '"/>' +
          '<rect x="18" y="32" width="8" height="24" fill="#1f2937"/>' +
          '<circle cx="40" cy="50" r="6" fill="#b45309"/>' +
          '<polygon points="8,88 18,78 18,96" fill="#f59e0b"/>' +
          '<circle cx="24" cy="118" r="12" fill="' + wheel + '" stroke="#1e3a8a" stroke-width="3"/>' +
          '<circle cx="48" cy="122" r="8" fill="' + wheel + '" stroke="#1e3a8a" stroke-width="3"/>' +
          '<circle cx="64" cy="122" r="8" fill="' + wheel + '" stroke="#1e3a8a" stroke-width="3"/>';
      }
      function plane(v) {
        var stripe = v === 1 ? "#ef4444" : v === 3 ? "#7c3aed" : "#facc15";
        var tip = v === 1 ? "#22c55e" : "#facc15";
        var wingH = v === 2 ? 28 : 44;
        var wingY = v === 2 ? 78 : 62;
        return '<rect x="10" y="48" width="10" height="32" rx="3" fill="#ef4444"/>' +
          '<rect x="16" y="82" width="56" height="18" rx="9" fill="#2563eb"/>' +
          '<rect x="48" y="74" width="12" height="10" rx="3" fill="#93c5fd"/>' +
          '<rect x="22" y="88" width="28" height="5" fill="' + stripe + '"/>' +
          '<rect x="28" y="' + wingY + '" width="14" height="' + wingH + '" rx="4" fill="#1d4ed8"/>' +
          '<rect x="28" y="' + (wingY + wingH - 8) + '" width="14" height="8" fill="' + tip + '"/>' +
          '<circle cx="72" cy="91" r="8" fill="#1d4ed8"/>';
      }
      function body(kind, v) {
        if (kind === "rocket") return rocket(v);
        if (kind === "ship") return ship(v);
        if (kind === "train") return train(v);
        return plane(v);
      }
      function mark(kind, variant, part) {
        var vb = part === "top" ? "0 0 80 70" : part === "bottom" ? "0 70 80 70" : "0 0 80 140";
        var h = part === "full" ? 140 : 70;
        return '<svg viewBox="' + vb + '" width="80" height="' + h + '">' + body(kind, variant) + "</svg>";
      }
      function cur() { return PUZZLES[state.i]; }
      function render() {
        var p = cur();
        document.getElementById("q").textContent = String(state.i + 1);
        document.getElementById("ok").textContent = String(state.correct);
        document.getElementById("ask").textContent = "看" + p.name + "，找出能拼上的那一块";
        document.getElementById("full").innerHTML = mark(p.kind, p.target, "full");
        document.getElementById("top").innerHTML = mark(p.kind, p.target, "top");
        document.getElementById("pickedBox").innerHTML = state.picked < 0
          ? '<span class="placeholder">点下面的①—④</span>'
          : mark(p.kind, p.options[state.picked], "bottom");
        var box = document.getElementById("opts");
        box.innerHTML = "";
        p.options.forEach(function (v, i) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "opt";
          if (state.picked === i) b.classList.add("on");
          if (state.lock && i === p.answer) b.classList.add("ok");
          if (state.lock && state.picked === i && i !== p.answer) b.classList.add("bad");
          b.innerHTML = '<span class="num">' + NUMS[i] + "</span>" + mark(p.kind, v, "bottom");
          b.onclick = function () { pick(i); };
          box.appendChild(b);
        });
        document.getElementById("next").textContent = state.i >= PUZZLES.length - 1 ? "完成" : "下一题";
      }
      function pick(i) {
        if (state.lock) return;
        state.picked = i;
        state.lock = true;
        if (!state.judged) {
          state.judged = true;
          if (i === cur().answer) state.correct += 1;
        }
        setStatus(i === cur().answer ? "拼对啦！小细节都对上了。" : "再看看条纹、轮子和翅膀。", i === cur().answer ? "ok" : "bad");
        render();
      }
      document.getElementById("reset").onclick = function () {
        state.picked = -1;
        state.lock = false;
        setStatus("再选一次。看看完整图形的小细节。");
        render();
      };
      document.getElementById("next").onclick = function () {
        if (state.picked < 0) {
          setStatus("先选一块拼图哦。", "bad");
          return;
        }
        if (state.i >= PUZZLES.length - 1) {
          setStatus("全部完成！这次对了 " + state.correct + " / " + PUZZLES.length + " 题。", "ok");
          return;
        }
        state.i += 1;
        state.picked = -1;
        state.lock = false;
        state.judged = false;
        setStatus("先看完整图形的条纹、轮子和翅膀。");
        render();
      };
      render();
    })();
  </script>
</body>
</html>
