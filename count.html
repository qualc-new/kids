<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>数一数</title>
  <style>
    :root {
      --bg: #ffffff; --paper: #f4f8fc; --ink: #2c3e50; --muted: #6b7c8f;
      --line: #c5d5e8; --red: #ff7a1a; --ok: #2bb673; --warn: #ffb347; --btn-ink: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 6%, #e3f0ff 0, transparent 26%),
        radial-gradient(circle at 92% 10%, #dff0ff 0, transparent 24%),
        radial-gradient(circle at 80% 95%, #fff3c9 0, transparent 28%),
        var(--bg);
      padding: 20px 16px 32px;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    a.home { color: var(--muted); font-size: 14px; }
    h1 { margin: 8px 0 6px; font-size: 28px; }
    .lead { margin: 0 0 14px; color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip, button {
      border: 3px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      border-radius: 999px;
      font: inherit;
      cursor: pointer;
      padding: 7px 14px;
    }
    .chip.active, button.primary { background: var(--red); border-color: var(--red); color: var(--btn-ink); }
    .stats { display: flex; gap: 20px; margin: 8px 0 14px; }
    .stat b { display: block; font-size: 26px; }
    .stat span { color: var(--muted); font-size: 13px; }
    .stage {
      background: var(--paper);
      border: 3px solid var(--line);
      border-radius: 24px;
      padding: 18px 16px 20px;
    }
    .ask { margin: 0 0 14px; font-size: 20px; font-weight: 700; }
    .items {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      min-height: 140px;
      padding: 16px;
      background: #eef5fb;
      border-radius: 18px;
    }
    .items svg { width: 64px; height: 40px; }
    .items.many { gap: 8px; padding: 10px; }
    .items.many svg { width: 44px; height: 28px; }
    .nums { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
    .nums.many { gap: 8px; }
    .num {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      border: 3px solid var(--line);
      background: #fff;
      font-size: 32px;
      font-weight: 700;
    }
    .nums.many .num {
      width: 48px;
      height: 48px;
      font-size: 20px;
      border-radius: 14px;
    }
    .custom-box {
      display: none;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
      margin-bottom: 4px;
    }
    .custom-box.show { display: flex; }
    .custom-box label {
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
    }
    .custom-box input {
      width: 72px;
      height: 40px;
      border: 3px solid var(--line);
      border-radius: 12px;
      font: inherit;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      color: var(--ink);
      background: #fff;
    }
    .custom-box input:focus {
      outline: none;
      border-color: var(--red);
    }
    .num.ok { border-color: var(--ok); background: #eef8f1; }
    .num.bad { border-color: var(--red); background: #fdeeee; }
    .status { margin: 14px 0 0; color: var(--muted); min-height: 22px; }

    a.home {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: #fff;
      border: 2px solid var(--line);
      color: var(--red);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    h1 { color: var(--red); font-weight: 800; letter-spacing: 0.5px; }
    .chip, button {
      font-weight: 700;
      padding: 9px 16px;
      background: #fff;
      box-shadow: 0 4px 0 #b8cce0;
    }
    .chip.active, button.primary {
      box-shadow: 0 4px 0 #d9650a;
    }
    .chip:active, button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #b8cce0;
    }
    .stat b { color: var(--red); font-weight: 800; }
    .ask { font-weight: 800; color: var(--ink); }
    .stage { box-shadow: 0 8px 0 #d4e4f7; background: #fff; }
    .num, .choice, .tile, .btns button {
      box-shadow: 0 5px 0 #b8cce0;
      font-weight: 800;
    }
    .num:active, .choice:active, .btns button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #b8cce0;
    }
    .status { font-size: 15px; font-weight: 600; padding: 8px 12px; border-radius: 12px; border: 2px solid transparent; }
    .status.ok {
      color: #187a4c;
      background: #d8f5e5;
      border-color: #2bb673;
      font-weight: 800;
    }
    .status.bad {
      color: #c62828;
      background: #fde8e8;
      border-color: #e53935;
      font-weight: 800;
    }

    .car-deco {
      position: fixed; width: 64px; height: 40px; pointer-events: none; opacity: 0.85; z-index: 0;
    }
    .car-deco-tl { top: 10px; left: 8px; }
    .car-deco-tr { top: 14px; right: 10px; transform: scaleX(-1); }
    .wrap { position: relative; z-index: 1; }
    .road-line {
      height: 7px; margin: 0 0 12px; border-radius: 999px;
      background: repeating-linear-gradient(90deg, #ffd166 0 12px, transparent 12px 22px), #4a5568;
      border: 2px solid #4a5568;
    }
    a.home {
      display: inline-flex !important; align-items: center; gap: 6px;
    }
    .stage { position: relative; }
    .stage::before, .stage::after {
      content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%;
      background: #2c3e50; border: 3px solid #94a3b8; z-index: 2; bottom: 8px;
    }
    .stage::before { left: 8px; }
    .stage::after { right: 8px; }
  </style>
</head>
<body>
  <svg class="car-deco car-deco-tl" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="16" width="52" height="14" rx="5" fill="#1e88e5"/><path d="M14 16l7-9h20l9 9z" fill="#1e88e5"/><circle cx="20" cy="31" r="5" fill="#2c3e50"/><circle cx="44" cy="31" r="5" fill="#2c3e50"/></svg>
  <svg class="car-deco car-deco-tr" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="14" width="44" height="16" rx="3" fill="#ff7a1a"/><rect x="12" y="8" width="22" height="8" rx="2" fill="#ff9a4d"/><circle cx="18" cy="32" r="5" fill="#2c3e50"/><circle cx="40" cy="32" r="5" fill="#2c3e50"/><rect x="48" y="18" width="10" height="8" fill="#ffd166"/></svg>
  <div class="wrap">
    <a class="home" href="index.html"><svg width="26" height="16" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="16" width="52" height="14" rx="5" fill="#ff7a1a"/><path d="M14 16l7-9h20l9 9z" fill="#ff7a1a"/><circle cx="20" cy="31" r="5" fill="#2c3e50"/><circle cx="44" cy="31" r="5" fill="#2c3e50"/></svg> 回家园</a>
    
    <h1>数一数</h1>
    <div class="road-line" aria-hidden="true"></div>
    <p class="lead">看一看，有几辆小汽车？点下面的数字。</p>
    <div class="row" id="levels"></div>
    <div class="custom-box" id="customBox">
      <label for="customMin">最小</label>
      <input id="customMin" type="number" min="1" max="30" value="5" inputmode="numeric" />
      <label for="customMax">最大</label>
      <input id="customMax" type="number" min="1" max="30" value="15" inputmode="numeric" />
      <button type="button" class="chip" id="customApply">确定</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="q">1</b><span>第几题</span></div>
      <div class="stat"><b id="ok">0</b><span>答对</span></div>
    </div>
    <div class="stage">
      <p class="ask" id="ask">有几辆小汽车？</p>
      <div class="items" id="items"></div>
      <div class="nums" id="nums"></div>
      <p class="status" id="status">先数一数，再点数字。</p>
    </div>
  </div>
  <script>
    (function () {
      const CAR = function (color) {
        return '<svg viewBox="0 0 64 40" width="72" height="44"><rect x="6" y="16" width="52" height="14" rx="5" fill="' + color + '"/><path d="M14 16l7-9h20l9 9z" fill="' + color + '"/><circle cx="20" cy="31" r="5.5" fill="#2c3e50"/><circle cx="44" cy="31" r="5.5" fill="#2c3e50"/><circle cx="20" cy="31" r="2" fill="#94a3b8"/><circle cx="44" cy="31" r="2" fill="#94a3b8"/><rect x="22" y="9" width="10" height="7" rx="1.5" fill="#dbeafe"/><rect x="34" y="9" width="10" height="7" rx="1.5" fill="#dbeafe"/></svg>';
      };
      const KINDS = [
        { name: "小汽车", svg: CAR("#1e88e5") },
        { name: "小汽车", svg: CAR("#ff7a1a") },
        { name: "小汽车", svg: CAR("#2bb673") },
      ];
      const DIGITS = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
      const RANGE_LEVELS = [
        { id: "lv10", label: "3 岁 · 1～10", min: 1, max: 10 },
        { id: "lv20", label: "4～5 岁 · 10～20", min: 10, max: 20 },
        { id: "custom", label: "进阶 · 自定义", custom: true },
      ];
      const DEFAULT_LEVEL = "lv10";
      const BOUND_MIN = 1;
      const BOUND_MAX = 30;

      const state = {
        levelId: DEFAULT_LEVEL,
        min: 1,
        max: 10,
        customMin: 5,
        customMax: 15,
        n: 1,
        kind: 0,
        prevN: 0,
        correct: 0,
        q: 1,
        lock: false,
      };

      function setStatus(msg, kind) {
        const el = document.getElementById("status");
        el.textContent = msg;
        el.classList.remove("ok", "bad");
        if (kind === "ok" || kind === "bad") el.classList.add(kind);
      }

      function rand(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
      function clampBound(n) {
        const v = Math.floor(Number(n));
        if (!isFinite(v)) return BOUND_MIN;
        return Math.max(BOUND_MIN, Math.min(BOUND_MAX, v));
      }
      function normalizeRange(lo, hi) {
        let a = clampBound(lo);
        let b = clampBound(hi);
        if (a > b) { const t = a; a = b; b = t; }
        return { min: a, max: b };
      }
      function wordOf(n) {
        if (n <= 0) return String(n);
        if (n === 2) return "两";
        if (n < 10) return DIGITS[n];
        if (n === 10) return "十";
        if (n < 20) return "十" + DIGITS[n - 10];
        if (n === 20) return "二十";
        if (n < 30) return "二十" + DIGITS[n - 20];
        if (n === 30) return "三十";
        return String(n);
      }
      function syncCustomBox() {
        const box = document.getElementById("customBox");
        const show = state.levelId === "custom";
        box.classList.toggle("show", show);
        if (show) {
          document.getElementById("customMin").value = String(state.customMin);
          document.getElementById("customMax").value = String(state.customMax);
        }
      }
      function setLevel(levelId, customMin, customMax) {
        const level = RANGE_LEVELS.find(function (item) { return item.id === levelId; }) || RANGE_LEVELS[0];
        state.levelId = level.id;
        if (level.custom) {
          if (customMin != null || customMax != null) {
            const range = normalizeRange(
              customMin != null ? customMin : state.customMin,
              customMax != null ? customMax : state.customMax
            );
            state.customMin = range.min;
            state.customMax = range.max;
          }
          state.min = state.customMin;
          state.max = state.customMax;
        } else {
          state.min = level.min;
          state.max = level.max;
        }
        state.correct = 0;
        state.q = 1;
        state.n = state.min;
        state.prevN = 0;
        document.querySelectorAll("#levels .chip").forEach(function (el) {
          el.classList.toggle("active", el.dataset.id === level.id);
        });
        syncCustomBox();
        nextQ();
      }
      function nextQ() {
        state.lock = false;
        state.kind = rand(0, KINDS.length - 1);
        let n = rand(state.min, state.max);
        if (n === state.prevN && state.max > state.min) {
          const opts = [];
          for (let i = state.min; i <= state.max; i++) {
            if (i !== state.prevN) opts.push(i);
          }
          n = opts[rand(0, opts.length - 1)];
        }
        state.prevN = n;
        state.n = n;
        const k = KINDS[state.kind];
        const many = state.n >= 8 || state.max - state.min >= 8;
        const items = document.getElementById("items");
        items.className = "items" + (many ? " many" : "");
        document.getElementById("ask").textContent = "有几辆" + k.name + "？";
        items.innerHTML = Array(state.n).fill(k.svg).join("");
        document.getElementById("q").textContent = String(state.q);
        document.getElementById("ok").textContent = String(state.correct);
        setStatus(state.n <= 5
          ? "用手指点着数：" + Array.from({ length: state.n }, function (_, i) { return i + 1; }).join("、") + "。"
          : "用手指点着一辆一辆数。（范围 " + state.min + "～" + state.max + "）");
        drawNums();
      }
      function drawNums() {
        const box = document.getElementById("nums");
        box.className = "nums" + (state.max - state.min >= 7 ? " many" : "");
        box.innerHTML = "";
        for (let i = state.min; i <= state.max; i++) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "num";
          b.textContent = String(i);
          b.setAttribute("aria-label", wordOf(i));
          b.onclick = function () { pick(i, b); };
          box.appendChild(b);
        }
      }
      function pick(i, btn) {
        if (state.lock) return;
        if (i === state.n) {
          state.lock = true;
          btn.classList.add("ok");
          state.correct += 1;
          document.getElementById("ok").textContent = String(state.correct);
          setStatus("对了！是 " + wordOf(state.n) + " 辆。", "ok");
          setTimeout(function () {
            state.q += 1;
            if (state.correct >= 8) {
              setStatus("真棒，连对好多题！再来一组。", "ok");
              state.correct = 0;
              state.q = 1;
            }
            nextQ();
          }, 900);
        } else {
          btn.classList.add("bad");
          setStatus("再数一遍。可以点着图，一辆一辆数。", "bad");
          setTimeout(function () { btn.classList.remove("bad"); }, 450);
        }
      }

      const levelRow = document.getElementById("levels");
      RANGE_LEVELS.forEach(function (level) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.dataset.id = level.id;
        btn.textContent = level.label;
        btn.onclick = function () { setLevel(level.id); };
        levelRow.appendChild(btn);
      });
      function applyCustom() {
        setLevel("custom", document.getElementById("customMin").value, document.getElementById("customMax").value);
      }
      document.getElementById("customApply").onclick = applyCustom;
      ["customMin", "customMax"].forEach(function (id) {
        document.getElementById(id).addEventListener("keydown", function (ev) {
          if (ev.key === "Enter") applyCustom();
        });
      });
      setLevel(DEFAULT_LEVEL);
    })();
  </script>
</body>
</html>
