<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>数一数</title>
  <style>
    :root {
      --bg: #ffffff; --paper: #fffaf3; --ink: #3a2a1a; --muted: #7a6454;
      --line: #ead7c2; --red: #e24b4a; --ok: #2f8a56; --warn: #c56a16; --btn-ink: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--ink);
      background: var(--bg);
      padding: 20px 16px 32px;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    a.home { color: var(--muted); font-size: 14px; }
    h1 { margin: 8px 0 6px; font-size: 28px; }
    .lead { margin: 0 0 14px; color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip, button {
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      border-radius: 999px;
      font: inherit;
      cursor: pointer;
      padding: 7px 14px;
    }
    .chip.active, button.primary { background: var(--red); border-color: var(--red); color: var(--btn-ink); }
    .stats { display: flex; gap: 20px; margin: 8px 0 14px; }
    .stat b { display: block; font-size: 26px; }
    .stat span { color: var(--muted); font-size: 13px; }
    .stage {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 16px 20px;
    }
    .ask { margin: 0 0 14px; font-size: 20px; font-weight: 700; }
    .items {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      min-height: 140px;
      padding: 16px;
      background: #f6ead8;
      border-radius: 12px;
    }
    .items svg { width: 64px; height: 64px; }
    .nums { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
    .num {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      border: 2px solid var(--line);
      background: #fff;
      font-size: 32px;
      font-weight: 700;
    }
    .num.ok { border-color: var(--ok); background: #eef8f1; }
    .num.bad { border-color: var(--red); background: #fdeeee; }
    .status { margin: 14px 0 0; color: var(--muted); min-height: 22px; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="home" href="index.html">全部练习</a>
    <h1>数一数</h1>
    <p class="lead">看一看，有几个？点下面的数字。</p>
    <div class="row">
      <button type="button" class="chip active" id="easy">3 岁 · 1到3</button>
      <button type="button" class="chip" id="hard">4～5 岁 · 1到5</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="q">1</b><span>第几题</span></div>
      <div class="stat"><b id="ok">0</b><span>答对</span></div>
    </div>
    <div class="stage">
      <p class="ask" id="ask">有几个苹果？</p>
      <div class="items" id="items"></div>
      <div class="nums" id="nums"></div>
      <p class="status" id="status">先数一数，再点数字。</p>
    </div>
  </div>
  <script>
    (function () {
      const KINDS = [
        { name: "苹果", svg: '<svg viewBox="0 0 48 48"><path d="M24 12c0-3 2-6 5-6" fill="none" stroke="#5a3a22" stroke-width="2"/><ellipse cx="31" cy="12" rx="6" ry="3" fill="#3d9a5f" transform="rotate(-30 31 12)"/><path d="M24 16c-8 0-13 8-12 16 1 7 6 12 12 12s11-5 12-12c1-8-4-16-12-16z" fill="#e24b4a"/></svg>' },
        { name: "星星", svg: '<svg viewBox="0 0 48 48"><polygon points="24,4 29,18 44,18 32,27 37,42 24,33 11,42 16,27 4,18 19,18" fill="#e0b125"/></svg>' },
        { name: "小球", svg: '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="16" fill="#3b7ec9"/><circle cx="18" cy="18" r="5" fill="rgba(255,255,255,.35)"/></svg>' },
      ];
      const WORDS = ["", "一", "两", "三", "四", "五"];
      const state = { max: 3, n: 1, kind: 0, correct: 0, q: 1, lock: false };

      function rand(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
      function nextQ() {
        state.lock = false;
        state.kind = rand(0, KINDS.length - 1);
        let n = rand(1, state.max);
        if (n === state.n) n = n === state.max ? 1 : n + 1;
        state.n = n;
        const k = KINDS[state.kind];
        document.getElementById("ask").textContent = "有几个" + k.name + "？";
        document.getElementById("items").innerHTML = Array(state.n).fill(k.svg).join("");
        document.getElementById("q").textContent = String(state.q);
        document.getElementById("ok").textContent = String(state.correct);
        document.getElementById("status").textContent = "用手指点着数：" + Array.from({ length: state.n }, function (_, i) { return i + 1; }).join("、") + "。";
        drawNums();
      }
      function drawNums() {
        const box = document.getElementById("nums");
        box.innerHTML = "";
        for (let i = 1; i <= state.max; i++) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "num";
          b.textContent = String(i);
          b.setAttribute("aria-label", WORDS[i]);
          b.onclick = function () { pick(i, b); };
          box.appendChild(b);
        }
      }
      function pick(i, btn) {
        if (state.lock) return;
        if (i === state.n) {
          state.lock = true;
          btn.classList.add("ok");
          state.correct += 1;
          document.getElementById("ok").textContent = String(state.correct);
          document.getElementById("status").textContent = "对了！是 " + WORDS[state.n] + " 个。";
          setTimeout(function () {
            state.q += 1;
            if (state.correct >= 8) {
              document.getElementById("status").textContent = "真棒，连对好多题！再来一组。";
              state.correct = 0;
              state.q = 1;
            }
            nextQ();
          }, 900);
        } else {
          btn.classList.add("bad");
          document.getElementById("status").textContent = "再数一遍。可以点着图，一个一个数。";
          setTimeout(function () { btn.classList.remove("bad"); }, 450);
        }
      }
      document.getElementById("easy").onclick = function () {
        state.max = 3; state.correct = 0; state.q = 1;
        this.classList.add("active");
        document.getElementById("hard").classList.remove("active");
        nextQ();
      };
      document.getElementById("hard").onclick = function () {
        state.max = 5; state.correct = 0; state.q = 1;
        this.classList.add("active");
        document.getElementById("easy").classList.remove("active");
        nextQ();
      };
      nextQ();
    })();
  </script>
</body>
</html>
