<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>找规律</title>
  <style>
    :root {
      --bg: #ffffff; --paper: #f4f8fc; --ink: #2c3e50; --muted: #6b7c8f;
      --line: #c5d5e8; --red: #ff7a1a; --ok: #2bb673; --btn-ink: #fff;
    }
    * { box-sizing: border-box; }
    html, body {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
      touch-action: auto;
    }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 6%, #e3f0ff 0, transparent 26%),
        radial-gradient(circle at 92% 10%, #dff0ff 0, transparent 24%),
        radial-gradient(circle at 80% 95%, #fff3c9 0, transparent 28%),
        var(--bg);
      padding: 20px 16px 32px;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    a.home { color: var(--muted); font-size: 14px; }
    h1 { margin: 8px 0 6px; font-size: 28px; }
    .lead { margin: 0 0 14px; color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip, button {
      border: 3px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      border-radius: 999px;
      font: inherit;
      cursor: pointer;
      padding: 7px 14px;
    }
    .chip.active { background: var(--red); border-color: var(--red); color: var(--btn-ink); }
    .stats { display: flex; gap: 20px; margin: 8px 0 14px; }
    .stat b { display: block; font-size: 26px; }
    .stat span { color: var(--muted); font-size: 13px; }
    .stage {
      background: var(--paper);
      border: 3px solid var(--line);
      border-radius: 24px;
      padding: 18px 16px 20px;
    }
    .ask { margin: 0 0 16px; font-size: 20px; font-weight: 700; }
    .seq {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      min-height: 90px;
      padding: 12px;
      background: #eef5fb;
      border-radius: 18px;
    }
    .cell {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: #fff;
      border: 3px solid var(--line);
    }
    .seq.long {
      gap: 6px;
    }
    .seq.long .cell {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border-width: 2px;
    }
    .seq.long .cell.q { font-size: 20px; }
    .seq.long .shape { width: 28px; height: 28px; }
    .seq.long .cell svg { width: 36px; height: 22px; }
    .seq.longer .cell {
      width: 36px;
      height: 36px;
      border-radius: 8px;
    }
    .seq.longer .cell.q { font-size: 16px; }
    .seq.longer .shape { width: 22px; height: 22px; }
    .seq.longer .cell svg { width: 30px; height: 18px; }
    .cell.q { border-style: dashed; color: var(--muted); font-size: 28px; font-weight: 700; }
    .shape { width: 40px; height: 40px; }
    .choices { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; margin-top: 18px; }
    .choice {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      border: 3px solid var(--line);
      background: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .choice.ok { border-color: var(--ok); background: #eef8f1; }
    .choice.bad { border-color: var(--red); background: #fdeeee; }
    .status { margin: 14px 0 0; color: var(--muted); min-height: 22px; }

    a.home {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: #fff;
      border: 2px solid var(--line);
      color: var(--red);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    h1 { color: var(--red); font-weight: 800; letter-spacing: 0.5px; }
    .chip, button {
      font-weight: 700;
      padding: 9px 16px;
      background: #fff;
      box-shadow: 0 4px 0 #b8cce0;
    }
    .chip.active, button.primary {
      box-shadow: 0 4px 0 #d9650a;
    }
    .chip:active, button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #b8cce0;
    }
    .stat b { color: var(--red); font-weight: 800; }
    .ask { font-weight: 800; color: var(--ink); }
    .stage { box-shadow: 0 8px 0 #d4e4f7; background: #fff; }
    .num, .choice, .tile, .btns button {
      box-shadow: 0 5px 0 #b8cce0;
      font-weight: 800;
    }
    .num:active, .choice:active, .btns button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #b8cce0;
    }
    .status { font-size: 15px; font-weight: 600; padding: 8px 12px; border-radius: 12px; border: 2px solid transparent; }
    .status.ok {
      color: #187a4c;
      background: #d8f5e5;
      border-color: #2bb673;
      font-weight: 800;
    }
    .status.bad {
      color: #c62828;
      background: #fde8e8;
      border-color: #e53935;
      font-weight: 800;
    }

    .car-deco {
      position: fixed; width: 64px; height: 40px; pointer-events: none; opacity: 0.85; z-index: 0;
    }
    .car-deco-tl { top: 10px; left: 8px; }
    .car-deco-tr { top: 14px; right: 10px; transform: scaleX(-1); }
    .wrap { position: relative; z-index: 1; }
    .road-line {
      height: 7px; margin: 0 0 12px; border-radius: 999px;
      background: repeating-linear-gradient(90deg, #ffd166 0 12px, transparent 12px 22px), #4a5568;
      border: 2px solid #4a5568;
    }
    a.home {
      display: inline-flex !important; align-items: center; gap: 6px;
    }
    .stage { position: relative; }
    .stage::before, .stage::after {
      content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%;
      background: #2c3e50; border: 3px solid #94a3b8; z-index: 2; bottom: 8px;
    }
    .stage::before { left: 8px; }
    .stage::after { right: 8px; }
  </style>
</head>
<body>
  <svg class="car-deco car-deco-tl" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="16" width="52" height="14" rx="5" fill="#1e88e5"/><path d="M14 16l7-9h20l9 9z" fill="#1e88e5"/><circle cx="20" cy="31" r="5" fill="#2c3e50"/><circle cx="44" cy="31" r="5" fill="#2c3e50"/></svg>
  <svg class="car-deco car-deco-tr" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="14" width="44" height="16" rx="3" fill="#ff7a1a"/><rect x="12" y="8" width="22" height="8" rx="2" fill="#ff9a4d"/><circle cx="18" cy="32" r="5" fill="#2c3e50"/><circle cx="40" cy="32" r="5" fill="#2c3e50"/><rect x="48" y="18" width="10" height="8" fill="#ffd166"/></svg>
  <div class="wrap">
    <a class="home" href="index.html"><svg width="26" height="16" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="16" width="52" height="14" rx="5" fill="#ff7a1a"/><path d="M14 16l7-9h20l9 9z" fill="#ff7a1a"/><circle cx="20" cy="31" r="5" fill="#2c3e50"/><circle cx="44" cy="31" r="5" fill="#2c3e50"/></svg> 回家园</a>
    
    <h1>找规律</h1>
    <div class="road-line" aria-hidden="true"></div>
    <p class="lead">看车队前面怎么排的，点出下一辆应该是谁。</p>
    <div class="row">
      <button type="button" class="chip active" id="easy">3 岁 · 两种轮流</button>
      <button type="button" class="chip" id="hard">4～5 岁 · 更长规律</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="q">1</b><span>第几题</span></div>
      <div class="stat"><b id="ok">0</b><span>答对</span></div>
    </div>
    <div class="stage">
      <p class="ask">下一个是哪个？</p>
      <div class="seq" id="seq"></div>
      <div class="choices" id="choices"></div>
      <p class="status" id="status">从左到右看，找一找重复的地方。</p>
    </div>
  </div>
  <script>
    (function () {
      const PALETTE = {
        red: "#ff7a1a",
        yellow: "#ffd166",
        blue: "#6bb6ff",
        green: "#2bb673",
      };
      const EASY_UNITS = [
        { unit: ["red", "blue"], pool: ["red", "blue", "yellow"] },
        { unit: ["yellow", "blue"], pool: ["yellow", "blue", "red"] },
        { unit: ["circle", "square"], pool: ["circle", "square", "tri"] },
        { unit: ["green", "red"], pool: ["green", "red", "blue"] },
        { unit: ["blue", "red"], pool: ["blue", "red", "yellow"] },
        { unit: ["yellow", "yellow", "blue"], pool: ["yellow", "blue", "red"] },
        { unit: ["green", "green", "red"], pool: ["green", "red", "blue"] },
      ];
      const HARD_UNITS = [
        { unit: ["red", "blue", "yellow"], pool: ["yellow", "red", "blue"] },
        { unit: ["red", "red", "blue", "blue"], pool: ["red", "blue", "yellow"] },
        { unit: ["circle", "circle", "square"], pool: ["square", "circle", "tri"] },
        { unit: ["green", "yellow", "green", "yellow"], pool: ["yellow", "green", "red"] },
        { unit: ["square", "circle", "circle"], pool: ["circle", "square", "tri"] },
        { unit: ["red", "blue", "blue", "red"], pool: ["red", "blue", "yellow"] },
        { unit: ["yellow", "green", "blue"], pool: ["yellow", "green", "blue"] },
      ];
      const LEN_EASY = 9;
      const LEN_HARD = 15;
      const state = { hard: false, i: 0, correct: 0, q: 1, lock: false, item: null };
      function rand(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
      function setStatus(msg, kind) {
        const el = document.getElementById("status");
        el.textContent = msg;
        el.classList.remove("ok", "bad");
        if (kind === "ok" || kind === "bad") el.classList.add(kind);
      }

      function buildItem(spec, shownLen) {
        const shown = [];
        for (let i = 0; i < shownLen; i++) shown.push(spec.unit[i % spec.unit.length]);
        return {
          shown: shown,
          next: spec.unit[shownLen % spec.unit.length],
          pool: spec.pool,
          _key: spec.unit.join("-"),
        };
      }

      function shuffle(a) {
        const arr = a.slice();
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
      }
      function mark(kind) {
        if (PALETTE[kind]) {
          return '<svg width="48" height="30" viewBox="0 0 64 40"><rect x="6" y="16" width="52" height="14" rx="5" fill="' + PALETTE[kind] + '"/><path d="M14 16l7-9h20l9 9z" fill="' + PALETTE[kind] + '"/><circle cx="20" cy="31" r="5.5" fill="#2c3e50"/><circle cx="44" cy="31" r="5.5" fill="#2c3e50"/><rect x="22" y="9" width="10" height="7" rx="1.5" fill="#dbeafe"/><rect x="34" y="9" width="10" height="7" rx="1.5" fill="#dbeafe"/></svg>';
        }
        if (kind === "circle") return '<div class="shape" style="border-radius:50%;background:#1e88e5"></div>';
        if (kind === "square") return '<div class="shape" style="background:#ffd166"></div>';
        return '<div class="shape" style="width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-bottom:36px solid #2bb673"></div>';
      }
      function nextQ() {
        state.lock = false;
        const bank = state.hard ? HARD_UNITS : EASY_UNITS;
        const shownLen = state.hard ? LEN_HARD : LEN_EASY;
        let n = rand(0, bank.length - 1);
        let tries = 0;
        while (state.item && bank[n].unit.join("-") === state.item._key && tries < 8) {
          n = rand(0, bank.length - 1);
          tries += 1;
        }
        state.item = buildItem(bank[n], shownLen);
        const seq = document.getElementById("seq");
        seq.className = "seq long" + (shownLen >= 15 ? " longer" : "");
        seq.innerHTML = "";
        state.item.shown.forEach(function (k) {
          const c = document.createElement("div");
          c.className = "cell";
          c.innerHTML = mark(k);
          seq.appendChild(c);
        });
        const q = document.createElement("div");
        q.className = "cell q";
        q.textContent = "?";
        seq.appendChild(q);
        const box = document.getElementById("choices");
        box.innerHTML = "";
        shuffle(state.item.pool).forEach(function (k) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "choice";
          b.innerHTML = mark(k);
          b.onclick = function () { pick(k, b); };
          box.appendChild(b);
        });
        document.getElementById("q").textContent = String(state.q);
        document.getElementById("ok").textContent = String(state.correct);
        setStatus("看一看，谁在重复出现。");
      }
      function pick(k, btn) {
        if (state.lock) return;
        if (k === state.item.next) {
          state.lock = true;
          btn.classList.add("ok");
          state.correct += 1;
          document.getElementById("ok").textContent = String(state.correct);
          setStatus("对了！就是这样排的。", "ok");
          setTimeout(function () {
            state.q += 1;
            if (state.correct >= 8) {
              state.correct = 0;
              state.q = 1;
              setStatus("规律找得很准！再来一组。", "ok");
            }
            nextQ();
          }, 900);
        } else {
          btn.classList.add("bad");
          setStatus("再看一遍前面几个，找重复的顺序。", "bad");
          setTimeout(function () { btn.classList.remove("bad"); }, 450);
        }
      }
      document.getElementById("easy").onclick = function () {
        state.hard = false; state.correct = 0; state.q = 1;
        this.classList.add("active");
        document.getElementById("hard").classList.remove("active");
        nextQ();
      };
      document.getElementById("hard").onclick = function () {
        state.hard = true; state.correct = 0; state.q = 1;
        this.classList.add("active");
        document.getElementById("easy").classList.remove("active");
        nextQ();
      };
      nextQ();
    })();
  </script>
</body>
</html>
