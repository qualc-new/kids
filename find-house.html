<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>找房子：观察与匹配</title>
  <style>
    :root {
      --bg: #ffffff;
      --paper: #f4f8fc;
      --ink: #2c3e50;
      --muted: #6b7c8f;
      --line: #c5d5e8;
      --red: #ff7a1a;
      --ok: #2bb673;
      --warn: #ffb347;
      --btn: #ff7a1a;
      --btn-ink: #fff;
    }
    * { box-sizing: border-box; }
    html, body {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
      touch-action: auto;
    }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 6%, #e3f0ff 0, transparent 26%),
        radial-gradient(circle at 92% 10%, #dff0ff 0, transparent 24%),
        radial-gradient(circle at 80% 95%, #fff3c9 0, transparent 28%),
        var(--bg);
      padding: 20px 16px 32px;
    }
    .wrap { max-width: 980px; margin: 0 auto; }
    a.home {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: #fff;
      border: 2px solid var(--line);
      color: var(--red);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    h1 { margin: 8px 0 6px; font-size: 30px; font-weight: 800; color: var(--red); letter-spacing: 0.5px; }
    .lead { margin: 0 0 16px; color: var(--muted); font-size: 15px; line-height: 1.5; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    .chip, button {
      border: 3px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      padding: 9px 16px;
      box-shadow: 0 4px 0 #b8cce0;
    }
    .chip.active, button.primary {
      background: var(--btn);
      border-color: var(--btn);
      color: var(--btn-ink);
      box-shadow: 0 4px 0 #d9650a;
    }
    button.ghost { background: #fff; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .stats { display: flex; gap: 18px; flex-wrap: wrap; margin: 8px 0 14px; }
    .stat b { display: block; font-size: 28px; line-height: 1.1; color: var(--red); font-weight: 800; }
    .stat span { color: var(--muted); font-size: 13px; }
    .stage-card {
      background: #fff;
      border: 3px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 8px 0 #d4e4f7;
    }
    canvas {
      display: block;
      width: 100%;
      height: 560px;
      touch-action: none;
      cursor: default;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .stage-card, .bar {
      -webkit-user-select: none;
      user-select: none;
    }
    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 14px 16px;
      border-top: 3px solid var(--line);
      background: #f4f8fc;
    }
    .status {
      margin: 0;
      flex: 1;
      min-width: 200px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.45;
      padding: 8px 12px;
      border-radius: 12px;
      border: 2px solid transparent;
    }
    .status.ok {
      color: #187a4c;
      background: #d8f5e5;
      border-color: #2bb673;
      font-weight: 800;
    }
    .status.bad {
      color: #c62828;
      background: #fde8e8;
      border-color: #e53935;
      font-weight: 800;
    }
    .formula {
      display: none;
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: 18px;
      background: #e8fff5;
      border: 3px solid #8fd9b5;
      color: var(--ok);
      font-size: 16px;
      font-weight: 700;
    }
    .formula.show { display: block; }
    .formula.warn { background: #fff8e6; border-color: #ffd166; color: #c98a00; }

    .car-deco {
      position: fixed;
      width: 72px;
      height: 44px;
      pointer-events: none;
      opacity: 0.9;
      z-index: 0;
    }
    .car-deco-tl { top: 12px; left: 10px; }
    .car-deco-tr { top: 16px; right: 12px; transform: scaleX(-1); }
    .car-deco-bl { bottom: 14px; left: 12px; opacity: 0.55; }
    .car-deco-br { bottom: 18px; right: 14px; opacity: 0.55; transform: scaleX(-1); }
    .wrap { position: relative; z-index: 1; }
    .page-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .page-head h1 { margin: 0; flex: 1; min-width: 200px; }
    .title-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #fff;
      border: 2px solid var(--line);
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }
    .road-line {
      height: 8px;
      margin: 0 0 14px;
      border-radius: 999px;
      background:
        repeating-linear-gradient(90deg, #ffd166 0 14px, transparent 14px 24px),
        #4a5568;
      border: 2px solid #4a5568;
    }
    a.home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    a.home svg, .title-badge svg { display: block; flex-shrink: 0; }
    button.primary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .stage-card { position: relative; }
    .stage-card::before,
    .stage-card::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #2c3e50;
      border: 3px solid #94a3b8;
      z-index: 2;
    }
    .stage-card::before { left: 10px; bottom: 10px; }
    .stage-card::after { right: 10px; bottom: 10px; }
    .stat {
      background: #fff;
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 8px 12px;
      min-width: 72px;
    }
  </style>
</head>
<body>
  <svg class="car-deco car-deco-tl" viewBox="0 0 72 44" aria-hidden="true"><rect x="8" y="18" width="56" height="14" rx="4" fill="#1e88e5"/><path d="M16 18l8-10h22l10 10z" fill="#1e88e5"/><circle cx="22" cy="33" r="6" fill="#2c3e50"/><circle cx="50" cy="33" r="6" fill="#2c3e50"/><rect x="26" y="10" width="12" height="7" rx="1" fill="#dbeafe"/><rect x="40" y="10" width="12" height="7" rx="1" fill="#dbeafe"/></svg>
  <svg class="car-deco car-deco-tr" viewBox="0 0 72 44" aria-hidden="true"><rect x="6" y="16" width="50" height="16" rx="3" fill="#ff7a1a"/><rect x="10" y="8" width="28" height="10" rx="2" fill="#ff9a4d"/><circle cx="20" cy="34" r="6" fill="#2c3e50"/><circle cx="48" cy="34" r="6" fill="#2c3e50"/><rect x="40" y="18" width="12" height="8" fill="#ffd166"/></svg>
  <svg class="car-deco car-deco-bl" viewBox="0 0 72 44" aria-hidden="true"><rect x="10" y="20" width="48" height="12" rx="3" fill="#2bb673"/><path d="M18 20l6-8h20l8 8z" fill="#2bb673"/><circle cx="24" cy="33" r="5" fill="#2c3e50"/><circle cx="48" cy="33" r="5" fill="#2c3e50"/></svg>
  <svg class="car-deco car-deco-br" viewBox="0 0 72 44" aria-hidden="true"><rect x="8" y="14" width="40" height="18" rx="2" fill="#5b8def"/><rect x="48" y="20" width="16" height="12" fill="#ffd166"/><circle cx="20" cy="34" r="5" fill="#2c3e50"/><circle cx="40" cy="34" r="5" fill="#2c3e50"/><circle cx="56" cy="34" r="5" fill="#2c3e50"/></svg>
  <div class="wrap">
    <p style="margin:0 0 8px">
      <a class="home" href="index.html">
        <svg width="28" height="18" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="16" width="52" height="14" rx="5" fill="#ff7a1a"/><path d="M14 16l7-9h20l9 9z" fill="#ff7a1a"/><circle cx="20" cy="31" r="5" fill="#2c3e50"/><circle cx="44" cy="31" r="5" fill="#2c3e50"/></svg>
        回家园
      </a>
    </p>
    <div class="page-head">
      <h1>找房子：观察与匹配</h1>
      <span class="title-badge">
        <svg width="28" height="18" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="16" width="52" height="14" rx="5" fill="#2bb673"/><path d="M14 16l7-9h20l9 9z" fill="#2bb673"/><circle cx="20" cy="31" r="5" fill="#2c3e50"/><circle cx="44" cy="31" r="5" fill="#2c3e50"/></svg>
        玩法还是找房子
      </span>
    </div>
    <div class="road-line" aria-hidden="true"></div>
    <p class="lead">左边是小动物想住的房子。从动物拖一条线到右边对应的房子上，也可以先点动物再点房子。</p>

    <div class="row" id="levels"></div>
    <div class="stats">
      <div class="stat"><b id="statLevel">1</b><span>关卡</span></div>
      <div class="stat"><b id="statLinked">0/4</b><span>已连线</span></div>
      <div class="stat"><b id="statRight">?</b><span>答对</span></div>
    </div>

    <div class="stage-card">
      <canvas id="stage" width="980" height="560"></canvas>
      <div class="bar">
        <button type="button" class="primary" id="btnCheck">
          <svg width="28" height="18" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="16" width="52" height="14" rx="5" fill="#fff"/><path d="M14 16l7-9h20l9 9z" fill="#fff"/><circle cx="20" cy="31" r="5" fill="#2c3e50"/><circle cx="44" cy="31" r="5" fill="#2c3e50"/></svg>
          检查
        </button>
        <button type="button" class="ghost" id="btnReset">再连一次</button>
        <button type="button" class="ghost" id="btnNext">下一关</button>
        <p class="status" id="status">从左边的小动物拖一条线，连到它要住的房子。</p>
      </div>
    </div>
    <div class="formula" id="formula"></div>
  </div>

  <script>
    (function () {
      const LEVELS = [
        {
          title: "第 1 关：看房顶和窗户",
          hint: "先看房顶颜色，再看窗户颜色。",
          animals: [
            { id: "rabbit", name: "小兔", kind: "rabbit", text: "红色房顶，黄色窗户" },
            { id: "cat", name: "小猫", kind: "cat", text: "蓝色房顶，绿色窗户" },
            { id: "dog", name: "小狗", kind: "dog", text: "绿色房顶，圆形门" },
            { id: "bear", name: "小熊", kind: "bear", text: "黄色房顶，蓝色窗户" },
          ],
          houses: [
            { id: "h1", roof: "#e53935", wall: "#fff6e8", window: "#f0c230", door: "#8b5a2b", doorShape: "rect", chimney: true, windows: 2 },
            { id: "h2", roof: "#3b7ec9", wall: "#fff6e8", window: "#3d9a5f", door: "#8b5a2b", doorShape: "rect", chimney: false, windows: 2 },
            { id: "h3", roof: "#3d9a5f", wall: "#fff6e8", window: "#f0c230", door: "#c45c2a", doorShape: "round", chimney: false, windows: 2 },
            { id: "h4", roof: "#e0b125", wall: "#fff6e8", window: "#4a8fd4", door: "#8b5a2b", doorShape: "rect", chimney: true, windows: 2 },
          ],
          answer: { rabbit: "h1", cat: "h2", dog: "h3", bear: "h4" },
        },
        {
          title: "第 2 关：还要看烟囱",
          hint: "有两栋红顶房子，再看窗户数量和烟囱。",
          animals: [
            { id: "rabbit", name: "小兔", kind: "rabbit", text: "红色房顶，两扇窗，有烟囱" },
            { id: "cat", name: "小猫", kind: "cat", text: "红色房顶，一扇窗，没有烟囱" },
            { id: "dog", name: "小狗", kind: "dog", text: "蓝色房顶，两扇窗，没有烟囱" },
            { id: "bear", name: "小熊", kind: "bear", text: "蓝色房顶，一扇窗，有烟囱" },
          ],
          houses: [
            { id: "h1", roof: "#e53935", wall: "#f8ecda", window: "#8ec6e8", door: "#8b5a2b", doorShape: "rect", chimney: true, windows: 2 },
            { id: "h2", roof: "#e53935", wall: "#f8ecda", window: "#8ec6e8", door: "#8b5a2b", doorShape: "rect", chimney: false, windows: 1 },
            { id: "h3", roof: "#3b7ec9", wall: "#f8ecda", window: "#8ec6e8", door: "#8b5a2b", doorShape: "rect", chimney: false, windows: 2 },
            { id: "h4", roof: "#3b7ec9", wall: "#f8ecda", window: "#8ec6e8", door: "#8b5a2b", doorShape: "rect", chimney: true, windows: 1 },
          ],
          answer: { rabbit: "h1", cat: "h2", dog: "h3", bear: "h4" },
        },
        {
          title: "第 3 关：墙、顶、窗都要看",
          hint: "有的房子很像，把三个特征都对上才行。",
          animals: [
            { id: "rabbit", name: "小兔", kind: "rabbit", text: "白墙，红色房顶，黄色窗户" },
            { id: "cat", name: "小猫", kind: "cat", text: "粉墙，红色房顶，黄色窗户" },
            { id: "dog", name: "小狗", kind: "dog", text: "白墙，蓝色房顶，黄色窗户" },
            { id: "bear", name: "小熊", kind: "bear", text: "白墙，红色房顶，蓝色窗户" },
          ],
          houses: [
            { id: "h1", roof: "#e53935", wall: "#f4f8fc", window: "#f0c230", door: "#8b5a2b", doorShape: "rect", chimney: true, windows: 2 },
            { id: "h2", roof: "#e53935", wall: "#f4c4c0", window: "#f0c230", door: "#8b5a2b", doorShape: "rect", chimney: true, windows: 2 },
            { id: "h3", roof: "#3b7ec9", wall: "#f4f8fc", window: "#f0c230", door: "#8b5a2b", doorShape: "rect", chimney: false, windows: 2 },
            { id: "h4", roof: "#e53935", wall: "#f4f8fc", window: "#4a8fd4", door: "#8b5a2b", doorShape: "rect", chimney: false, windows: 2 },
          ],
          answer: { rabbit: "h1", cat: "h2", dog: "h3", bear: "h4" },
        },
      ];

      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d");
      const statusEl = document.getElementById("status");
      const formulaEl = document.getElementById("formula");

      const state = {
        level: 0,
        houseOrder: [],
        links: {},
        selected: null,
        drag: null,
        checked: false,
        results: {},
        status: "",
      };
      let cssW = 980;
      let cssH = 560;
      let layoutCache = null;

      function level() { return LEVELS[state.level]; }
      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
      }
      function linkedCount() {
        return Object.keys(state.links).filter(function (k) { return state.links[k]; }).length;
      }
      function houseOf(id) {
        return level().houses.find(function (h) { return h.id === id; });
      }

      function resetRound(keepOrder) {
        const lv = level();
        state.links = {};
        state.selected = null;
        state.drag = null;
        state.checked = false;
        state.results = {};
        if (!keepOrder) state.houseOrder = shuffle(lv.houses.map(function (h) { return h.id; }));
        state.status = lv.hint + " 从动物拖线到房子。";
        render();
      }

      function layout() {
        const lv = level();
        const pad = 18;
        const leftW = Math.min(320, cssW * 0.38);
        const rightW = 150;
        const leftX = pad;
        const rightX = cssW - pad - rightW;
        const top = 54;
        const gap = (cssH - top - pad) / 4;
        const animals = lv.animals.map(function (a, i) {
          const y = top + i * gap;
          return {
            id: a.id,
            x: leftX,
            y: y,
            w: leftW,
            h: gap - 12,
            port: { x: leftX + leftW, y: y + (gap - 12) / 2 },
            data: a,
          };
        });
        const houses = state.houseOrder.map(function (hid, i) {
          const y = top + i * gap;
          return {
            id: hid,
            x: rightX,
            y: y,
            w: rightW,
            h: gap - 12,
            port: { x: rightX, y: y + (gap - 12) / 2 },
            data: houseOf(hid),
          };
        });
        layoutCache = { animals: animals, houses: houses, top: top };
        return layoutCache;
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
        else {
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
        }
      }

      function drawAnimalFace(kind, x, y) {
        ctx.save();
        ctx.translate(x, y);
        if (kind === "rabbit") {
          ctx.fillStyle = "#f3d2b3";
          ctx.beginPath(); ctx.ellipse(-8, -22, 5, 14, -0.15, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.ellipse(8, -22, 5, 14, 0.15, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#f7c0c8";
          ctx.beginPath(); ctx.ellipse(-8, -22, 2.2, 8, -0.15, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.ellipse(8, -22, 2.2, 8, 0.15, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#f3d2b3";
          ctx.beginPath(); ctx.arc(0, -4, 14, 0, Math.PI * 2); ctx.fill();
        } else if (kind === "cat") {
          ctx.fillStyle = "#e8b56a";
          ctx.beginPath();
          ctx.moveTo(-16, -8); ctx.lineTo(-10, -26); ctx.lineTo(-2, -10);
          ctx.moveTo(16, -8); ctx.lineTo(10, -26); ctx.lineTo(2, -10);
          ctx.fill();
          ctx.beginPath(); ctx.arc(0, -2, 14, 0, Math.PI * 2); ctx.fill();
        } else if (kind === "dog") {
          ctx.fillStyle = "#c9956a";
          ctx.beginPath(); ctx.ellipse(-16, 2, 7, 10, 0.4, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.ellipse(16, 2, 7, 10, -0.4, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(0, -2, 14, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.fillStyle = "#c9a06a";
          ctx.beginPath(); ctx.arc(-11, -14, 6, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(11, -14, 6, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(0, -2, 15, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = "#2c3e50";
        ctx.beginPath(); ctx.arc(-5, -4, 1.6, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(5, -4, 1.6, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#2c3e50";
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(0, 2, 4, 0.15, Math.PI - 0.15); ctx.stroke();
        ctx.restore();
      }

      function drawHouse(h, box) {
        const x = box.x + box.w / 2;
        const baseY = box.y + box.h - 10;
        const wallW = 78;
        const wallH = 48;
        const wallX = x - wallW / 2;
        const wallY = baseY - wallH;
        ctx.fillStyle = "#d8c3a6";
        ctx.fillRect(wallX + 8, baseY - 4, wallW - 16, 6);
        if (h.chimney) {
          ctx.fillStyle = "#b07058";
          ctx.fillRect(x + 18, wallY - 28, 12, 26);
        }
        ctx.fillStyle = h.roof;
        ctx.beginPath();
        ctx.moveTo(x, wallY - 28);
        ctx.lineTo(x + wallW / 2 + 10, wallY + 4);
        ctx.lineTo(x - wallW / 2 - 10, wallY + 4);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = h.wall;
        ctx.fillRect(wallX, wallY, wallW, wallH);
        ctx.strokeStyle = "rgba(58,42,26,0.18)";
        ctx.strokeRect(wallX, wallY, wallW, wallH);
        ctx.fillStyle = h.window;
        if (h.windows === 1) {
          ctx.fillRect(x - 11, wallY + 10, 22, 16);
          ctx.strokeStyle = "#f4f8fc";
          ctx.strokeRect(x - 11, wallY + 10, 22, 16);
          ctx.beginPath(); ctx.moveTo(x, wallY + 10); ctx.lineTo(x, wallY + 26); ctx.stroke();
        } else {
          ctx.fillRect(wallX + 10, wallY + 10, 18, 16);
          ctx.fillRect(x + 3, wallY + 10, 18, 16);
        }
        ctx.fillStyle = h.door;
        if (h.doorShape === "round") {
          ctx.beginPath();
          ctx.moveTo(x - 9, baseY);
          ctx.lineTo(x - 9, wallY + 26);
          ctx.arc(x, wallY + 26, 9, Math.PI, 0);
          ctx.lineTo(x + 9, baseY);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.fillRect(x - 9, wallY + 22, 18, wallH - 22);
        }
      }

      function drawLink(from, to, color, width) {
        const mx = (from.x + to.x) / 2;
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(from.x, from.y);
        ctx.bezierCurveTo(mx, from.y, mx, to.y, to.x, to.y);
        ctx.stroke();
      }

      function linkColor(animalId) {
        if (!state.checked) return "#c56a16";
        return state.results[animalId] ? "#2bb673" : "#ff7a1a";
      }

      function render() {
        const lv = level();
        const lay = layout();
        ctx.clearRect(0, 0, cssW, cssH);
        ctx.fillStyle = "#f4f8fc";
        ctx.fillRect(0, 0, cssW, cssH);

        ctx.fillStyle = "#2c3e50";
        ctx.font = "bold 16px Microsoft YaHei, sans-serif";
        ctx.fillText(lv.title, 20, 30);
        ctx.fillStyle = "#6b7c8f";
        ctx.font = "13px Microsoft YaHei, sans-serif";
        ctx.fillText("小动物的家", 20, 48);
        ctx.textAlign = "right";
        ctx.fillText("四栋房子", cssW - 20, 48);
        ctx.textAlign = "left";

        Object.keys(state.links).forEach(function (aid) {
          if (state.drag && state.drag.id === aid) return;
          const hid = state.links[aid];
          if (!hid) return;
          const a = lay.animals.find(function (x) { return x.id === aid; });
          const h = lay.houses.find(function (x) { return x.id === hid; });
          if (a && h) drawLink(a.port, h.port, linkColor(aid), 4);
        });
        if (state.drag) {
          const a = lay.animals.find(function (x) { return x.id === state.drag.id; });
          if (a) drawLink(a.port, { x: state.drag.x, y: state.drag.y }, "#ff7a1a", 4);
        }

        lay.animals.forEach(function (box) {
          const on = state.selected === box.id || (state.drag && state.drag.id === box.id);
          const ok = state.checked && state.results[box.id] === true;
          const bad = state.checked && state.results[box.id] === false;
          ctx.fillStyle = on ? "#e3f0ff" : "#f4f8fc";
          roundRect(box.x, box.y, box.w, box.h, 12);
          ctx.fill();
          ctx.strokeStyle = bad ? "#ff7a1a" : ok ? "#2bb673" : on ? "#ff7a1a" : "#c5d5e8";
          ctx.lineWidth = on || bad || ok ? 2 : 1;
          roundRect(box.x, box.y, box.w, box.h, 12);
          ctx.stroke();
          drawAnimalFace(box.data.kind, box.x + 36, box.y + box.h / 2 + 4);
          ctx.fillStyle = "#2c3e50";
          ctx.font = "bold 15px Microsoft YaHei, sans-serif";
          ctx.fillText(box.data.name, box.x + 62, box.y + 28);
          ctx.fillStyle = "#6b7c8f";
          ctx.font = "13px Microsoft YaHei, sans-serif";
          wrapText(box.data.text, box.x + 62, box.y + 50, box.w - 86, 18);
          ctx.fillStyle = on ? "#ff7a1a" : "#9ec5ea";
          ctx.beginPath();
          ctx.arc(box.port.x, box.port.y, 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#f4f8fc";
          ctx.beginPath();
          ctx.arc(box.port.x, box.port.y, 3.5, 0, Math.PI * 2);
          ctx.fill();
        });

        lay.houses.forEach(function (box) {
          const takenBy = Object.keys(state.links).find(function (k) { return state.links[k] === box.id; });
          const hover = state.drag && hitHouse(state.drag, lay) === box.id;
          const ok = state.checked && takenBy && state.results[takenBy];
          const bad = state.checked && takenBy && state.results[takenBy] === false;
          ctx.fillStyle = hover ? "#e3f0ff" : "#f4f8fc";
          roundRect(box.x, box.y, box.w, box.h, 12);
          ctx.fill();
          ctx.strokeStyle = bad ? "#ff7a1a" : ok ? "#2bb673" : hover ? "#ff7a1a" : "#c5d5e8";
          ctx.lineWidth = hover || ok || bad ? 2 : 1;
          roundRect(box.x, box.y, box.w, box.h, 12);
          ctx.stroke();
          drawHouse(box.data, box);
          ctx.fillStyle = hover ? "#ff7a1a" : "#9ec5ea";
          ctx.beginPath();
          ctx.arc(box.port.x, box.port.y, 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#f4f8fc";
          ctx.beginPath();
          ctx.arc(box.port.x, box.port.y, 3.5, 0, Math.PI * 2);
          ctx.fill();
        });

        syncChrome();
      }

      function wrapText(text, x, y, maxW, lineH) {
        const chars = text.split("");
        let line = "";
        let yy = y;
        chars.forEach(function (ch) {
          const test = line + ch;
          if (ctx.measureText(test).width > maxW && line) {
            ctx.fillText(line, x, yy);
            line = ch;
            yy += lineH;
          } else line = test;
        });
        if (line) ctx.fillText(line, x, yy);
      }

      function hitAnimal(pt, lay) {
        for (let i = 0; i < lay.animals.length; i++) {
          const b = lay.animals[i];
          if (pt.x >= b.x && pt.x <= b.x + b.w + 10 && pt.y >= b.y && pt.y <= b.y + b.h) return b.id;
        }
        return null;
      }
      function hitHouse(pt, lay) {
        for (let i = 0; i < lay.houses.length; i++) {
          const b = lay.houses[i];
          if (pt.x >= b.x - 10 && pt.x <= b.x + b.w && pt.y >= b.y && pt.y <= b.y + b.h) return b.id;
        }
        return null;
      }

      function connect(animalId, houseId) {
        Object.keys(state.links).forEach(function (k) {
          if (state.links[k] === houseId) delete state.links[k];
        });
        state.links[animalId] = houseId;
        state.selected = null;
        state.checked = false;
        state.results = {};
        state.status = "已连 " + linkedCount() + " / 4。四条线都连好后点「检查」。";
      }

      function toLocal(ev) {
        const box = canvas.getBoundingClientRect();
        return { x: ev.clientX - box.left, y: ev.clientY - box.top };
      }

      canvas.addEventListener("pointerdown", function (ev) {
        const pt = toLocal(ev);
        const lay = layout();
        const aid = hitAnimal(pt, lay);
        if (!aid) {
          const hid = hitHouse(pt, lay);
          if (hid && state.selected) {
            connect(state.selected, hid);
            render();
          }
          return;
        }
        ev.preventDefault();
        canvas.setPointerCapture(ev.pointerId);
        state.drag = { id: aid, x: pt.x, y: pt.y, startX: pt.x, startY: pt.y, moved: false };
        state.selected = aid;
        canvas.style.cursor = "grabbing";
        render();
      });
      canvas.addEventListener("pointermove", function (ev) {
        if (!state.drag) return;
        const pt = toLocal(ev);
        if (Math.hypot(pt.x - state.drag.startX, pt.y - state.drag.startY) > 8) state.drag.moved = true;
        state.drag.x = pt.x;
        state.drag.y = pt.y;
        render();
      });
      document.addEventListener("selectstart", function (ev) {
        if (state.drag) ev.preventDefault();
      });
      function endDrag(ev) {
        if (!state.drag) return;
        const pt = toLocal(ev);
        const lay = layout();
        const hid = hitHouse(pt, lay);
        const moved = state.drag.moved;
        const aid = state.drag.id;
        state.drag = null;
        canvas.style.cursor = "default";
        if (hid) connect(aid, hid);
        else if (!moved) {
          state.selected = aid;
          state.status = "已选中" + level().animals.find(function (a) { return a.id === aid; }).name + "，再点右边的房子。";
        }
        render();
      }
      canvas.addEventListener("pointerup", endDrag);
      canvas.addEventListener("pointercancel", endDrag);

      function check() {
        if (linkedCount() < 4) {
          state.checked = false;
          state.results = {};
          state.status = "还没连完。每个小动物都要连到一栋房子。";
          formulaEl.className = "formula show warn";
          formulaEl.textContent = "先把 4 条线都连上，再检查。";
          render();
          return;
        }
        const ans = level().answer;
        let right = 0;
        level().animals.forEach(function (a) {
          const ok = state.links[a.id] === ans[a.id];
          state.results[a.id] = ok;
          if (ok) right += 1;
        });
        state.checked = true;
        if (right === 4) {
          state.status = "全对了！每个小动物都找到了自己的家。";
          formulaEl.className = "formula show";
          formulaEl.textContent = "观察得很仔细。可以点「下一关」，房子顺序会打乱。";
        } else {
          state.status = "对了 " + right + " 条。绿线是对的，红线要再看看描述。";
          formulaEl.className = "formula show warn";
          formulaEl.textContent = "红线可以重新拖。对照左边的房顶、窗户、门和烟囱。";
        }
        render();
      }

      function syncChrome() {
        document.getElementById("statLevel").textContent = String(state.level + 1);
        document.getElementById("statLinked").textContent = linkedCount() + "/4";
        const right = state.checked
          ? String(Object.keys(state.results).filter(function (k) { return state.results[k]; }).length)
          : "?";
        document.getElementById("statRight").textContent = right;
        statusEl.textContent = state.status;
        statusEl.classList.remove("ok", "bad");
        if (state.checked) {
          const allOk = level().animals.every(function (a) { return state.results[a.id]; });
          statusEl.classList.add(allOk ? "ok" : "bad");
        }
        document.getElementById("btnNext").disabled = !(state.checked && linkedCount() === 4 &&
          Object.keys(state.results).filter(function (k) { return state.results[k]; }).length === 4);
        document.querySelectorAll("#levels .chip").forEach(function (el, i) {
          el.classList.toggle("active", i === state.level);
        });
      }

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        cssW = rect.width;
        cssH = rect.height;
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        render();
      }

      document.getElementById("levels").innerHTML = LEVELS.map(function (lv, i) {
        return '<button type="button" class="chip">第 ' + (i + 1) + " 关</button>";
      }).join("");
      document.querySelectorAll("#levels .chip").forEach(function (el, i) {
        el.addEventListener("click", function () {
          state.level = i;
          resetRound(false);
        });
      });
      document.getElementById("btnCheck").onclick = check;
      document.getElementById("btnReset").onclick = function () { resetRound(true); };
      document.getElementById("btnNext").onclick = function () {
        state.level = (state.level + 1) % LEVELS.length;
        resetRound(false);
      };

      window.addEventListener("resize", resize);
      resetRound(false);
      resize();
    })();
  </script>
</body>
</html>
