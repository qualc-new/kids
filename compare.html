<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>谁更多</title>
  <style>
    :root {
      --bg: #ffffff; --paper: #fffaf3; --ink: #3a2a1a; --muted: #7a6454;
      --line: #ead7c2; --red: #e24b4a; --ok: #2f8a56; --btn-ink: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--ink);
      background: var(--bg);
      padding: 20px 16px 32px;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    a.home { color: var(--muted); font-size: 14px; }
    h1 { margin: 8px 0 6px; font-size: 28px; }
    .lead { margin: 0 0 14px; color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip, button {
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      border-radius: 999px;
      font: inherit;
      cursor: pointer;
      padding: 7px 14px;
    }
    .chip.active { background: var(--red); border-color: var(--red); color: var(--btn-ink); }
    .stats { display: flex; gap: 20px; margin: 8px 0 14px; }
    .stat b { display: block; font-size: 26px; }
    .stat span { color: var(--muted); font-size: 13px; }
    .stage {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 16px 20px;
    }
    .ask { margin: 0 0 14px; font-size: 20px; font-weight: 700; }
    .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .side {
      min-height: 180px;
      background: #f6ead8;
      border-radius: 12px;
      padding: 12px;
      border: 3px solid transparent;
    }
    .side h3 { margin: 0 0 8px; font-size: 15px; text-align: center; }
    .dots { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .dot { width: 36px; height: 36px; border-radius: 50%; background: #e24b4a; }
    .dot.blue { background: #3b7ec9; }
    .btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
    .btns button {
      min-width: 120px;
      height: 56px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      background: #fff;
    }
    .btns button.ok { border-color: var(--ok); background: #eef8f1; }
    .btns button.bad { border-color: var(--red); background: #fdeeee; }
    .status { margin: 14px 0 0; color: var(--muted); min-height: 22px; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="home" href="index.html">全部练习</a>
    <h1>谁更多</h1>
    <p class="lead">数一数两边，再选出谁多。有时候两边一样多。</p>
    <div class="row">
      <button type="button" class="chip active" id="easy">3 岁 · 差得明显</button>
      <button type="button" class="chip" id="hard">4～5 岁 · 含一样多</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="q">1</b><span>第几题</span></div>
      <div class="stat"><b id="ok">0</b><span>答对</span></div>
    </div>
    <div class="stage">
      <p class="ask">哪边更多？</p>
      <div class="sides">
        <div class="side" id="left"><h3>左边</h3><div class="dots" id="leftDots"></div></div>
        <div class="side" id="right"><h3>右边</h3><div class="dots" id="rightDots"></div></div>
      </div>
      <div class="btns" id="btns"></div>
      <p class="status" id="status">先数左边，再数右边。</p>
    </div>
  </div>
  <script>
    (function () {
      const state = { hard: false, left: 3, right: 1, ans: "left", correct: 0, q: 1, lock: false };
      function rand(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
      function dots(el, n, cls) {
        el.innerHTML = "";
        for (let i = 0; i < n; i++) {
          const d = document.createElement("div");
          d.className = "dot" + (cls || "");
          el.appendChild(d);
        }
      }
      function nextQ() {
        state.lock = false;
        const max = state.hard ? 5 : 4;
        if (!state.hard) {
          state.left = rand(1, max);
          do { state.right = rand(1, max); } while (Math.abs(state.left - state.right) < 2);
        } else {
          const mode = rand(0, 2);
          if (mode === 0) {
            state.left = rand(1, max);
            state.right = state.left;
          } else {
            state.left = rand(1, max);
            do { state.right = rand(1, max); } while (state.right === state.left);
          }
        }
        state.ans = state.left === state.right ? "same" : (state.left > state.right ? "left" : "right");
        dots(document.getElementById("leftDots"), state.left, "");
        dots(document.getElementById("rightDots"), state.right, " blue");
        document.getElementById("q").textContent = String(state.q);
        document.getElementById("ok").textContent = String(state.correct);
        document.getElementById("status").textContent = "数一数，再点下面的按钮。";
        drawBtns();
      }
      function drawBtns() {
        const box = document.getElementById("btns");
        const opts = [
          { id: "left", label: "左边多" },
          { id: "same", label: "一样多" },
          { id: "right", label: "右边多" },
        ];
        const show = state.hard ? opts : opts.filter(function (o) { return o.id !== "same"; });
        box.innerHTML = "";
        show.forEach(function (o) {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = o.label;
          b.onclick = function () { pick(o.id, b); };
          box.appendChild(b);
        });
      }
      function pick(id, btn) {
        if (state.lock) return;
        if (id === state.ans) {
          state.lock = true;
          btn.classList.add("ok");
          state.correct += 1;
          document.getElementById("ok").textContent = String(state.correct);
          const msg = state.ans === "same"
            ? "两边一样多。"
            : (state.ans === "left" ? "左边多。" : "右边多。") + " " + state.left + " 和 " + state.right + "。";
          document.getElementById("status").textContent = "对了！" + msg;
          setTimeout(function () {
            state.q += 1;
            if (state.correct >= 8) {
              state.correct = 0;
              state.q = 1;
              document.getElementById("status").textContent = "真棒！再来一组。";
            }
            nextQ();
          }, 1000);
        } else {
          btn.classList.add("bad");
          document.getElementById("status").textContent = "再数一遍。一边点一个，数完再比。";
          setTimeout(function () { btn.classList.remove("bad"); }, 450);
        }
      }
      document.getElementById("easy").onclick = function () {
        state.hard = false; state.correct = 0; state.q = 1;
        this.classList.add("active");
        document.getElementById("hard").classList.remove("active");
        nextQ();
      };
      document.getElementById("hard").onclick = function () {
        state.hard = true; state.correct = 0; state.q = 1;
        this.classList.add("active");
        document.getElementById("easy").classList.remove("active");
        nextQ();
      };
      nextQ();
    })();
  </script>
</body>
</html>
