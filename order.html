<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>排排队</title>
  <style>
    :root {
      --bg: #ffffff; --paper: #f4f8fc; --ink: #2c3e50; --muted: #6b7c8f;
      --line: #c5d5e8; --red: #ff7a1a; --ok: #2bb673; --btn-ink: #fff;
    }
    * { box-sizing: border-box; }
    html, body {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
      touch-action: auto;
    }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 6%, #e3f0ff 0, transparent 26%),
        radial-gradient(circle at 92% 10%, #dff0ff 0, transparent 24%),
        radial-gradient(circle at 80% 95%, #fff3c9 0, transparent 28%),
        var(--bg);
      padding: 20px 16px 32px;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    a.home { color: var(--muted); font-size: 14px; }
    h1 { margin: 8px 0 6px; font-size: 28px; }
    .lead { margin: 0 0 14px; color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip, button {
      border: 3px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      border-radius: 999px;
      font: inherit;
      cursor: pointer;
      padding: 7px 14px;
    }
    .chip.active, button.primary { background: var(--red); border-color: var(--red); color: var(--btn-ink); }
    .stats { display: flex; gap: 20px; margin: 8px 0 14px; }
    .stat b { display: block; font-size: 26px; }
    .stat span { color: var(--muted); font-size: 13px; }
    .stage {
      background: var(--paper);
      border: 3px solid var(--line);
      border-radius: 24px;
      padding: 18px 16px 20px;
    }
    .ask { margin: 0 0 14px; font-size: 20px; font-weight: 700; }
    .slots, .pool, .slot, .ghost-tile, .stage {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .slots {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 90px;
      margin-bottom: 16px;
    }
    .slot {
      width: 72px;
      height: 72px;
      border-radius: 14px;
      border: 2px dashed var(--line);
      background: #eef5fb;
      display: grid;
      place-items: center;
      font-size: 13px;
      color: var(--muted);
    }
    .slot.filled {
      border-style: solid;
      background: #fff;
      color: var(--ink);
      font-size: 28px;
      font-weight: 700;
    }
    .slot.hot { border-color: var(--red); background: #fff1e0; }
    .pool {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 80px;
      padding: 12px;
      background: #eef5fb;
      border-radius: 18px;
    }
    .tile {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      border: 3px solid var(--line);
      background: #fff;
      font-size: 28px;
      font-weight: 700;
      cursor: grab;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    .slots.many .slot, .pool.many .tile, .ghost-tile.many {
      width: 48px;
      height: 48px;
      font-size: 18px;
      border-radius: 12px;
    }
    .slots.many .slot { font-size: 11px; }
    .slots.many .slot.filled { font-size: 18px; }
    .tile.ghost { opacity: 0.25; }
    .ghost-tile {
      position: fixed;
      width: 64px;
      height: 64px;
      border-radius: 14px;
      border: 3px solid var(--line);
      background: #fff;
      font-size: 28px;
      font-weight: 700;
      display: none;
      place-items: center;
      pointer-events: none;
      z-index: 9;
    }
    .custom-box {
      display: none;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
      margin-bottom: 4px;
    }
    .custom-box.show { display: flex; }
    .custom-box label {
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
    }
    .custom-box input {
      width: 72px;
      height: 40px;
      border: 3px solid var(--line);
      border-radius: 12px;
      font: inherit;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      color: var(--ink);
      background: #fff;
    }
    .custom-box input:focus {
      outline: none;
      border-color: var(--red);
    }
    .status { margin: 14px 0 0; color: var(--muted); min-height: 22px; }

    a.home {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: #fff;
      border: 2px solid var(--line);
      color: var(--red);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    h1 { color: var(--red); font-weight: 800; letter-spacing: 0.5px; }
    .chip, button {
      font-weight: 700;
      padding: 9px 16px;
      background: #fff;
      box-shadow: 0 4px 0 #b8cce0;
    }
    .chip.active, button.primary {
      box-shadow: 0 4px 0 #d9650a;
    }
    .chip:active, button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #b8cce0;
    }
    .stat b { color: var(--red); font-weight: 800; }
    .ask { font-weight: 800; color: var(--ink); }
    .stage { box-shadow: 0 8px 0 #d4e4f7; background: #fff; }
    .num, .choice, .tile, .btns button {
      box-shadow: 0 5px 0 #b8cce0;
      font-weight: 800;
    }
    .num:active, .choice:active, .btns button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #b8cce0;
    }
    .status { font-size: 15px; font-weight: 600; padding: 8px 12px; border-radius: 12px; border: 2px solid transparent; }
    .status.ok {
      color: #187a4c;
      background: #d8f5e5;
      border-color: #2bb673;
      font-weight: 800;
    }
    .status.bad {
      color: #c62828;
      background: #fde8e8;
      border-color: #e53935;
      font-weight: 800;
    }

    .car-deco {
      position: fixed; width: 64px; height: 40px; pointer-events: none; opacity: 0.85; z-index: 0;
    }
    .car-deco-tl { top: 10px; left: 8px; }
    .car-deco-tr { top: 14px; right: 10px; transform: scaleX(-1); }
    .wrap { position: relative; z-index: 1; }
    .road-line {
      height: 7px; margin: 0 0 12px; border-radius: 999px;
      background: repeating-linear-gradient(90deg, #ffd166 0 12px, transparent 12px 22px), #4a5568;
      border: 2px solid #4a5568;
    }
    a.home {
      display: inline-flex !important; align-items: center; gap: 6px;
    }
    .stage { position: relative; }
    .stage::before, .stage::after {
      content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%;
      background: #2c3e50; border: 3px solid #94a3b8; z-index: 2; bottom: 8px;
    }
    .stage::before { left: 8px; }
    .stage::after { right: 8px; }
  </style>
</head>
<body>
  <svg class="car-deco car-deco-tl" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="16" width="52" height="14" rx="5" fill="#1e88e5"/><path d="M14 16l7-9h20l9 9z" fill="#1e88e5"/><circle cx="20" cy="31" r="5" fill="#2c3e50"/><circle cx="44" cy="31" r="5" fill="#2c3e50"/></svg>
  <svg class="car-deco car-deco-tr" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="14" width="44" height="16" rx="3" fill="#ff7a1a"/><rect x="12" y="8" width="22" height="8" rx="2" fill="#ff9a4d"/><circle cx="18" cy="32" r="5" fill="#2c3e50"/><circle cx="40" cy="32" r="5" fill="#2c3e50"/><rect x="48" y="18" width="10" height="8" fill="#ffd166"/></svg>
  <div class="wrap">
    <a class="home" href="index.html"><svg width="26" height="16" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="16" width="52" height="14" rx="5" fill="#ff7a1a"/><path d="M14 16l7-9h20l9 9z" fill="#ff7a1a"/><circle cx="20" cy="31" r="5" fill="#2c3e50"/><circle cx="44" cy="31" r="5" fill="#2c3e50"/></svg> 回家园</a>
    
    <h1>排排队</h1>
    <div class="road-line" aria-hidden="true"></div>
    <p class="lead">给车队按号码从小到大排队。可以点空位再点号码，也可以拖进去。</p>
    <div class="row">
      <span id="levels" style="display:contents"></span>
      <button type="button" class="ghost" id="reset">再来一盘</button>
    </div>
    <div class="custom-box" id="customBox">
      <label for="customMin">最小</label>
      <input id="customMin" type="number" min="1" max="30" value="5" inputmode="numeric" />
      <label for="customMax">最大</label>
      <input id="customMax" type="number" min="1" max="30" value="12" inputmode="numeric" />
      <button type="button" class="chip" id="customApply">确定</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="done">0</b><span>完成盘数</span></div>
      <div class="stat"><b id="left">0</b><span>还没排</span></div>
    </div>
    <div class="stage">
      <p class="ask">车队从小到大排队</p>
      <div class="slots" id="slots"></div>
      <div class="pool" id="pool"></div>
      <p class="status" id="status">先找最小的数字，放到最左边。</p>
    </div>
  </div>
  <div class="ghost-tile" id="ghost"></div>
  <script>
    (function () {
      const RANGE_LEVELS = [
        { id: "lv10", label: "3 岁 · 1～10", min: 1, max: 10 },
        { id: "lv20", label: "4～5 岁 · 10～20", min: 10, max: 20 },
        { id: "custom", label: "进阶 · 自定义", custom: true },
      ];
      const DEFAULT_LEVEL = "lv10";
      const BOUND_MIN = 1;
      const BOUND_MAX = 30;
      const state = {
        levelId: DEFAULT_LEVEL,
        min: 1,
        max: 10,
        customMin: 5,
        customMax: 12,
        slots: [],
        pool: [],
        selectedSlot: null,
        drag: null,
        done: 0,
      };

      function count() { return state.max - state.min + 1; }
      function setStatus(msg, kind) {
        const el = document.getElementById("status");
        el.textContent = msg;
        el.classList.remove("ok", "bad");
        if (kind === "ok" || kind === "bad") el.classList.add(kind);
      }

      function expectAt(i) { return state.min + i; }
      function clampBound(n) {
        const v = Math.floor(Number(n));
        if (!isFinite(v)) return BOUND_MIN;
        return Math.max(BOUND_MIN, Math.min(BOUND_MAX, v));
      }
      function normalizeRange(lo, hi) {
        let a = clampBound(lo);
        let b = clampBound(hi);
        if (a > b) { const t = a; a = b; b = t; }
        return { min: a, max: b };
      }
      function shuffle(a) {
        const arr = a.slice();
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
      }
      function syncCustomBox() {
        const box = document.getElementById("customBox");
        const show = state.levelId === "custom";
        box.classList.toggle("show", show);
        if (show) {
          document.getElementById("customMin").value = String(state.customMin);
          document.getElementById("customMax").value = String(state.customMax);
        }
      }
      function setLevel(levelId, customMin, customMax) {
        const level = RANGE_LEVELS.find(function (item) { return item.id === levelId; }) || RANGE_LEVELS[0];
        state.levelId = level.id;
        if (level.custom) {
          if (customMin != null || customMax != null) {
            const range = normalizeRange(
              customMin != null ? customMin : state.customMin,
              customMax != null ? customMax : state.customMax
            );
            state.customMin = range.min;
            state.customMax = range.max;
          }
          state.min = state.customMin;
          state.max = state.customMax;
        } else {
          state.min = level.min;
          state.max = level.max;
        }
        state.done = 0;
        document.querySelectorAll("#levels .chip").forEach(function (el) {
          el.classList.toggle("active", el.dataset.id === level.id);
        });
        syncCustomBox();
        deal();
      }
      function deal() {
        const n = count();
        state.slots = Array.from({ length: n }, function () { return null; });
        state.pool = shuffle(Array.from({ length: n }, function (_, i) { return expectAt(i); }));
        state.selectedSlot = null;
        state.drag = null;
        setStatus("把 " + state.min + "～" + state.max + " 从小到大排好，先找最小的。");
        render();
      }
      function leftover() {
        return state.pool.length;
      }
      function render() {
        const many = count() >= 8;
        const slots = document.getElementById("slots");
        const pool = document.getElementById("pool");
        const ghost = document.getElementById("ghost");
        slots.className = "slots" + (many ? " many" : "");
        pool.className = "pool" + (many ? " many" : "");
        ghost.classList.toggle("many", many);
        slots.innerHTML = "";
        pool.innerHTML = "";
        state.slots.forEach(function (n, i) {
          const el = document.createElement("button");
          el.type = "button";
          el.className = "slot" + (n != null ? " filled" : "") + (state.selectedSlot === i ? " hot" : "");
          el.textContent = n != null ? String(n) : "第" + (i + 1) + "位";
          el.onclick = function () { onSlotClick(i); };
          slots.appendChild(el);
        });
        state.pool.forEach(function (n) {
          const el = document.createElement("button");
          el.type = "button";
          el.className = "tile";
          el.textContent = String(n);
          el.dataset.n = String(n);
          el.addEventListener("pointerdown", onDown);
          el.onclick = function () { onTileClick(n); };
          pool.appendChild(el);
        });
        document.getElementById("left").textContent = String(leftover());
        document.getElementById("done").textContent = String(state.done);
      }
      function tryPlace(n, slotIndex) {
        const expect = expectAt(slotIndex);
        if (n === expect) {
          state.slots[slotIndex] = n;
          state.pool = state.pool.filter(function (x) { return x !== n; });
          state.selectedSlot = null;
          setStatus("对了！继续排下一个。", "ok");
          render();
          if (leftover() === 0) {
            state.done += 1;
            setStatus("排好了！从小到大：" + state.slots.join("、"), "ok");
            document.getElementById("done").textContent = String(state.done);
            setTimeout(deal, 1100);
          }
        } else {
          setStatus("第 " + (slotIndex + 1) + " 个位置应该放 " + expect + "。", "bad");
          render();
        }
      }
      function onSlotClick(i) {
        if (state.slots[i] != null) return;
        state.selectedSlot = i;
        setStatus("再点下面的数字放进来。");
        render();
      }
      function onTileClick(n) {
        if (state.drag) return;
        if (state.selectedSlot == null) {
          const empty = state.slots.findIndex(function (x) { return x == null; });
          if (empty >= 0) tryPlace(n, empty);
          return;
        }
        tryPlace(n, state.selectedSlot);
      }
      function onDown(ev) {
        if (ev.pointerType === "mouse" && ev.button !== 0) return;
        ev.preventDefault();
        const n = Number(ev.currentTarget.dataset.n);
        const rect = ev.currentTarget.getBoundingClientRect();
        ev.currentTarget.setPointerCapture(ev.pointerId);
        ev.currentTarget.classList.add("ghost");
        state.drag = {
          n: n,
          moved: false,
          x0: ev.clientX,
          y0: ev.clientY,
          ox: ev.clientX - rect.left,
          oy: ev.clientY - rect.top,
          w: rect.width,
          h: rect.height,
        };
        const g = document.getElementById("ghost");
        g.style.display = "grid";
        g.style.width = rect.width + "px";
        g.style.height = rect.height + "px";
        g.style.fontSize = window.getComputedStyle(ev.currentTarget).fontSize;
        g.textContent = String(n);
        moveGhost(ev.clientX, ev.clientY);
      }
      function moveGhost(x, y) {
        const g = document.getElementById("ghost");
        const ox = state.drag ? state.drag.ox : g.offsetWidth / 2;
        const oy = state.drag ? state.drag.oy : g.offsetHeight / 2;
        g.style.left = (x - ox) + "px";
        g.style.top = (y - oy) + "px";
      }
      function slotAt(x, y) {
        const nodes = document.querySelectorAll(".slot");
        for (let i = 0; i < nodes.length; i++) {
          const b = nodes[i].getBoundingClientRect();
          if (x >= b.left && x <= b.right && y >= b.top && y <= b.bottom) return i;
        }
        return null;
      }
      window.addEventListener("pointermove", function (ev) {
        if (!state.drag) return;
        if (Math.hypot(ev.clientX - state.drag.x0, ev.clientY - state.drag.y0) > 8) state.drag.moved = true;
        moveGhost(ev.clientX, ev.clientY);
        const idx = slotAt(ev.clientX, ev.clientY);
        document.querySelectorAll(".slot").forEach(function (el, i) {
          el.classList.toggle("hot", idx === i && state.slots[i] == null);
        });
      });
      document.addEventListener("selectstart", function (ev) {
        if (state.drag) ev.preventDefault();
      });
      window.addEventListener("pointerup", function (ev) {
        if (!state.drag) return;
        const n = state.drag.n;
        const moved = state.drag.moved;
        const idx = slotAt(ev.clientX, ev.clientY);
        document.getElementById("ghost").style.display = "none";
        state.drag = null;
        if (moved && idx != null && state.slots[idx] == null) tryPlace(n, idx);
        else render();
      });

      const levelRow = document.getElementById("levels");
      RANGE_LEVELS.forEach(function (level) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.dataset.id = level.id;
        btn.textContent = level.label;
        btn.onclick = function () { setLevel(level.id); };
        levelRow.appendChild(btn);
      });
      function applyCustom() {
        setLevel("custom", document.getElementById("customMin").value, document.getElementById("customMax").value);
      }
      document.getElementById("customApply").onclick = applyCustom;
      ["customMin", "customMax"].forEach(function (id) {
        document.getElementById(id).addEventListener("keydown", function (ev) {
          if (ev.key === "Enter") applyCustom();
        });
      });
      document.getElementById("reset").onclick = deal;
      setLevel(DEFAULT_LEVEL);
    })();
  </script>
</body>
</html>
