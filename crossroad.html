<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>红绿灯过马路</title>
  <style>
    :root {
      --bg: #ffffff; --paper: #f4f8fc; --ink: #2c3e50; --muted: #6b7c8f;
      --line: #c5d5e8; --red: #ff7a1a; --ok: #2bb673; --btn-ink: #fff;
      --sky: #1e88e5; --road: #4a5568; --sun: #ffd166;
    }
    * { box-sizing: border-box; }
    html, body {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
      touch-action: auto;
    }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 6%, #e3f0ff 0, transparent 26%),
        radial-gradient(circle at 92% 10%, #dff0ff 0, transparent 24%),
        radial-gradient(circle at 80% 95%, #fff3c9 0, transparent 28%),
        var(--bg);
      padding: 20px 16px 32px;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    a.home { color: var(--muted); font-size: 14px; }
    h1 { margin: 8px 0 6px; font-size: 28px; }
    .lead { margin: 0 0 14px; color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip, button {
      border: 3px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      border-radius: 999px;
      font: inherit;
      cursor: pointer;
      padding: 7px 14px;
    }
    .chip.active, button.primary { background: var(--red); border-color: var(--red); color: var(--btn-ink); }
    .stats { display: flex; gap: 20px; margin: 8px 0 14px; }
    .stat b { display: block; font-size: 26px; }
    .stat span { color: var(--muted); font-size: 13px; }
    .stage {
      background: var(--paper);
      border: 3px solid var(--line);
      border-radius: 24px;
      padding: 16px 16px 22px;
    }
    .ask { margin: 0 0 12px; font-size: 20px; font-weight: 700; }
    .status { margin: 12px 0 0; color: var(--muted); min-height: 22px; }

    a.home {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: #fff;
      border: 2px solid var(--line);
      color: var(--red);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    h1 { color: var(--red); font-weight: 800; letter-spacing: 0.5px; }
    .chip, button {
      font-weight: 700;
      padding: 9px 16px;
      background: #fff;
      box-shadow: 0 4px 0 #b8cce0;
    }
    .chip.active, button.primary {
      box-shadow: 0 4px 0 #d9650a;
    }
    .chip:active, button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #b8cce0;
    }
    .stat b { color: var(--red); font-weight: 800; }
    .ask { font-weight: 800; color: var(--ink); }
    .stage { box-shadow: 0 8px 0 #d4e4f7; background: #fff; }
    .status { font-size: 15px; font-weight: 600; padding: 8px 12px; border-radius: 12px; border: 2px solid transparent; }
    .status.ok {
      color: #187a4c;
      background: #d8f5e5;
      border-color: #2bb673;
      font-weight: 800;
    }
    .status.bad {
      color: #c62828;
      background: #fde8e8;
      border-color: #e53935;
      font-weight: 800;
    }

    .car-deco {
      position: fixed; width: 64px; height: 40px; pointer-events: none; opacity: 0.85; z-index: 0;
    }
    .car-deco-tl { top: 10px; left: 8px; }
    .car-deco-tr { top: 14px; right: 10px; transform: scaleX(-1); }
    .wrap { position: relative; z-index: 1; }
    .road-line {
      height: 7px; margin: 0 0 12px; border-radius: 999px;
      background: repeating-linear-gradient(90deg, #ffd166 0 12px, transparent 12px 22px), #4a5568;
      border: 2px solid #4a5568;
    }
    a.home {
      display: inline-flex !important; align-items: center; gap: 6px;
    }
    .stage { position: relative; }
    .stage::before, .stage::after {
      content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%;
      background: #2c3e50; border: 3px solid #94a3b8; z-index: 2; bottom: 8px;
    }
    .stage::before { left: 8px; }
    .stage::after { right: 8px; }

    .scene {
      position: relative;
      height: min(58vh, 420px);
      min-height: 320px;
      border-radius: 18px;
      overflow: hidden;
      border: 3px solid var(--line);
      background:
        linear-gradient(#c8e6c9 0 18%, #e8f5e9 18% 26%, transparent 26%),
        linear-gradient(transparent 74%, #e8f5e9 74% 82%, #c8e6c9 82% 100%),
        #dbeafe;
    }
    .sidewalk {
      position: absolute;
      left: 0; right: 0;
      height: 18%;
      background:
        repeating-linear-gradient(90deg, #e2e8f0 0 28px, #cbd5e1 28px 56px);
      border-top: 2px solid #94a3b8;
      border-bottom: 2px solid #94a3b8;
    }
    .sidewalk.far { top: 0; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; }
    .sidewalk.near { bottom: 0; }
    .goal-flag {
      font-size: 13px;
      font-weight: 800;
      color: var(--sky);
      background: #fff;
      border: 2px solid var(--sky);
      border-radius: 999px;
      padding: 3px 10px;
    }
    .roadway {
      position: absolute;
      left: 0; right: 0;
      top: 26%;
      height: 48%;
      background:
        repeating-linear-gradient(90deg, #ffd166 0 18px, transparent 18px 34px) center / 100% 6px no-repeat,
        var(--road);
    }
    .zebra {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 72px;
      transform: translateX(-50%);
      background: repeating-linear-gradient(
        180deg,
        #fff 0 14px,
        transparent 14px 26px
      );
      opacity: 0.92;
    }
    .cars-lane {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .traffic-car {
      position: absolute;
      width: 70px;
      height: 36px;
      top: 50%;
      margin-top: -18px;
      left: -80px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      will-change: transform;
    }
    .pole {
      position: absolute;
      right: 12px;
      top: 6%;
      width: 78px;
      z-index: 4;
    }
    .pole-post {
      width: 14px;
      height: 64px;
      margin: 0 auto;
      background: linear-gradient(90deg, #475569, #94a3b8 45%, #334155);
      border-radius: 5px;
      box-shadow: 2px 0 0 #1e293b;
    }
    .signal {
      width: 78px;
      padding: 12px 10px;
      background: linear-gradient(160deg, #475569 0%, #1e293b 40%, #0f172a 100%);
      border-radius: 18px;
      border: 4px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      box-shadow:
        0 8px 0 #0f172a,
        inset 0 2px 0 rgba(255,255,255,.18),
        inset 0 -3px 6px rgba(0,0,0,.35);
    }
    .lamp {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 32% 28%, #64748b, #334155 55%, #1e293b 100%);
      border: 3px solid #0f172a;
      box-shadow:
        inset 0 -4px 8px rgba(0,0,0,.55),
        inset 0 3px 5px rgba(255,255,255,.12),
        0 3px 0 #020617;
      transition: background 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }
    .lamp-num {
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,.45);
      opacity: 0;
      pointer-events: none;
    }
    .lamp.on-red,
    .lamp.on-yellow,
    .lamp.on-green {
      border-color: rgba(15, 23, 42, 0.55);
    }
    .lamp.on-red .lamp-num,
    .lamp.on-yellow .lamp-num,
    .lamp.on-green .lamp-num {
      opacity: 1;
    }
    .lamp.on-red {
      background:
        radial-gradient(circle at 30% 26%, #ff8a80 0%, #ef5350 38%, #c62828 72%, #7f1d1d 100%);
      box-shadow:
        inset 0 -5px 10px rgba(0,0,0,.4),
        inset 0 4px 6px rgba(255,255,255,.35),
        0 0 22px rgba(229, 57, 53, 0.9),
        0 4px 0 #7f1d1d;
    }
    .lamp.on-yellow {
      background:
        radial-gradient(circle at 30% 26%, #fff59d 0%, #ffd54f 40%, #f9a825 75%, #f57f17 100%);
      box-shadow:
        inset 0 -5px 10px rgba(0,0,0,.28),
        inset 0 4px 6px rgba(255,255,255,.45),
        0 0 22px rgba(255, 193, 7, 0.95),
        0 4px 0 #e65100;
      animation: yellow-pulse 0.55s ease-in-out infinite;
    }
    .lamp.on-yellow .lamp-num {
      color: #4e342e;
      text-shadow: 0 1px 0 rgba(255,255,255,.35);
    }
    @keyframes yellow-pulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(0.72); }
    }
    .lamp.on-green {
      background:
        radial-gradient(circle at 30% 26%, #b9f6ca 0%, #69f0ae 35%, #2bb673 70%, #1b5e20 100%);
      box-shadow:
        inset 0 -5px 10px rgba(0,0,0,.35),
        inset 0 4px 6px rgba(255,255,255,.4),
        0 0 22px rgba(43, 182, 115, 0.9),
        0 4px 0 #14532d;
    }
    .light-label {
      position: absolute;
      right: 98px;
      top: 10%;
      z-index: 4;
      font-size: 15px;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: 999px;
      background: #fff;
      border: 2px solid var(--line);
      color: var(--ink);
      white-space: nowrap;
      box-shadow: 0 3px 0 #d4e4f7;
    }
    .light-label.red { border-color: #e53935; color: #c62828; }
    .light-label.yellow { border-color: #f0a202; color: #b7791f; }
    .light-label.green { border-color: #2bb673; color: #187a4c; }

    .kid {
      position: absolute;
      left: 50%;
      bottom: 6%;
      width: 48px;
      height: 56px;
      margin-left: -24px;
      z-index: 5;
      transition: none;
      will-change: bottom;
    }
    .kid svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 2px 0 rgba(0,0,0,.12)); }
    .kid.walk-bounce { animation: bounce 0.28s ease infinite alternate; }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-4px); }
    }
    .kid.hit {
      animation: shake 0.45s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 14px;
    }
    .walk-btn {
      min-width: 180px;
      min-height: 56px;
      font-size: 20px;
      font-weight: 800;
      border-radius: 18px;
      touch-action: none;
      box-shadow: 0 5px 0 #b8cce0;
    }
    .walk-btn:active:not(:disabled),
    .walk-btn.holding {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #b8cce0;
      background: var(--ok);
      border-color: var(--ok);
      color: #fff;
    }
    .walk-btn:disabled {
      opacity: 0.55;
      cursor: default;
    }
    button.ghost {
      background: #fff;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <svg class="car-deco car-deco-tl" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="16" width="52" height="14" rx="5" fill="#1e88e5"/><path d="M14 16l7-9h20l9 9z" fill="#1e88e5"/><circle cx="20" cy="31" r="5" fill="#2c3e50"/><circle cx="44" cy="31" r="5" fill="#2c3e50"/></svg>
  <svg class="car-deco car-deco-tr" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="14" width="44" height="16" rx="3" fill="#ff7a1a"/><rect x="12" y="8" width="22" height="8" rx="2" fill="#ff9a4d"/><circle cx="18" cy="32" r="5" fill="#2c3e50"/><circle cx="40" cy="32" r="5" fill="#2c3e50"/><rect x="48" y="18" width="10" height="8" fill="#ffd166"/></svg>
  <div class="wrap">
    <a class="home" href="index.html"><svg width="26" height="16" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="16" width="52" height="14" rx="5" fill="#ff7a1a"/><path d="M14 16l7-9h20l9 9z" fill="#ff7a1a"/><circle cx="20" cy="31" r="5" fill="#2c3e50"/><circle cx="44" cy="31" r="5" fill="#2c3e50"/></svg> 回家园</a>

    <h1>红绿灯过马路</h1>
    <div class="road-line" aria-hidden="true"></div>
    <p class="lead">看灯再走：绿灯按住「走一走」，黄灯和红灯都要停下。安全走到对面就算过关。</p>
    <div class="row">
      <button type="button" class="chip active" id="easy">3 岁 · 慢慢过</button>
      <button type="button" class="chip" id="hard">4～5 岁 · 更快</button>
      <button type="button" class="ghost" id="reset">再来一次</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="ok">0</b><span>安全到达</span></div>
      <div class="stat"><b id="try">0</b><span>尝试次数</span></div>
    </div>
    <div class="stage">
      <p class="ask" id="ask">绿灯走，黄灯停，红灯停在人行道。</p>
      <div class="scene" id="scene" aria-label="过马路场景">
        <div class="sidewalk far"><span class="goal-flag">对面人行道</span></div>
        <div class="roadway">
          <div class="zebra" aria-hidden="true"></div>
          <div class="cars-lane" id="cars"></div>
        </div>
        <div class="sidewalk near"></div>
        <div class="light-label red" id="lightLabel">
          <span id="lightText">红灯 · 停下</span>
        </div>
        <div class="pole">
          <div class="signal" aria-hidden="true">
            <div class="lamp" id="lampRed"><span class="lamp-num" id="secRed"></span></div>
            <div class="lamp" id="lampYellow"><span class="lamp-num" id="secYellow"></span></div>
            <div class="lamp" id="lampGreen"><span class="lamp-num" id="secGreen"></span></div>
          </div>
          <div class="pole-post" aria-hidden="true"></div>
        </div>
        <div class="kid" id="kid" aria-label="小朋友">
          <svg viewBox="0 0 48 56" aria-hidden="true">
            <circle cx="24" cy="12" r="9" fill="#ffcc80"/>
            <circle cx="21" cy="11" r="1.4" fill="#2c3e50"/>
            <circle cx="27" cy="11" r="1.4" fill="#2c3e50"/>
            <path d="M20 15c1.2 1.4 6.8 1.4 8 0" stroke="#e65100" stroke-width="1.2" fill="none" stroke-linecap="round"/>
            <path d="M14 8c3-6 17-6 20 0-4 2-16 2-20 0z" fill="#1e88e5"/>
            <rect x="15" y="22" width="18" height="18" rx="5" fill="#ff7a1a"/>
            <rect x="11" y="24" width="6" height="12" rx="3" fill="#ffcc80"/>
            <rect x="31" y="24" width="6" height="12" rx="3" fill="#ffcc80"/>
            <rect x="16" y="40" width="7" height="12" rx="3" fill="#1e88e5"/>
            <rect x="25" y="40" width="7" height="12" rx="3" fill="#1e88e5"/>
          </svg>
        </div>
      </div>
      <div class="controls">
        <button type="button" class="walk-btn primary" id="walk" aria-label="按住走一走">按住 · 走一走</button>
      </div>
      <p class="status" id="status">先看灯：红灯停，绿灯走。</p>
    </div>
  </div>
  <script>
    (function () {
      const CAR_COLORS = ["#1e88e5", "#ff7a1a", "#2bb673", "#ffd166", "#5b8def"];
      const LEVELS = {
        easy: {
          green: [5500, 10000],
          yellow: [1800, 2800],
          red: [2000, 6000],
          walkSpeed: 55,
          carSpeed: [120, 200],
          spawn: [800, 2200],
          ask: "绿灯走，黄灯停一停，红灯停在人行道。",
        },
        hard: {
          green: [4500, 8500],
          yellow: [1000, 1700],
          red: [1600, 4800],
          walkSpeed: 48,
          carSpeed: [160, 280],
          spawn: [500, 1600],
          ask: "绿灯快走，黄灯马上停，红灯千万别走。",
        },
      };

      const state = {
        hard: false,
        light: "red",
        progress: 0,
        holding: false,
        phase: "play",
        ok: 0,
        try: 0,
        lock: false,
        redWarn: false,
        yellowWarn: false,
        lightUntil: 0,
        cars: [],
        lastTs: 0,
        spawnAt: 0,
        redStreak: 0,
        shownSec: -1,
      };

      const el = {
        kid: document.getElementById("kid"),
        cars: document.getElementById("cars"),
        walk: document.getElementById("walk"),
        status: document.getElementById("status"),
        ask: document.getElementById("ask"),
        lightLabel: document.getElementById("lightLabel"),
        lightText: document.getElementById("lightText"),
        lampRed: document.getElementById("lampRed"),
        lampYellow: document.getElementById("lampYellow"),
        lampGreen: document.getElementById("lampGreen"),
        secRed: document.getElementById("secRed"),
        secYellow: document.getElementById("secYellow"),
        secGreen: document.getElementById("secGreen"),
        ok: document.getElementById("ok"),
        try: document.getElementById("try"),
        scene: document.getElementById("scene"),
      };

      function cfg() {
        return state.hard ? LEVELS.hard : LEVELS.easy;
      }

      function rand(a, b) {
        return a + Math.random() * (b - a);
      }

      function randInt(a, b) {
        return Math.floor(rand(a, b + 1));
      }

      function pickDur(range) {
        if (!range || range[1] <= 0) return 0;
        return rand(range[0], range[1]);
      }

      function setStatus(msg, kind) {
        el.status.textContent = msg;
        el.status.classList.remove("ok", "bad");
        if (kind === "ok" || kind === "bad") el.status.classList.add(kind);
      }

      function carBg(hex) {
        const svg =
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 36">' +
          '<rect x="6" y="14" width="52" height="14" rx="4" fill="' + hex + '"/>' +
          '<path d="M16 14l6-8h18l8 8z" fill="' + hex + '"/>' +
          '<rect x="24" y="8" width="10" height="6" rx="1" fill="#dbeafe"/>' +
          '<rect x="36" y="8" width="10" height="6" rx="1" fill="#dbeafe"/>' +
          '<circle cx="20" cy="29" r="5" fill="#2c3e50"/>' +
          '<circle cx="48" cy="29" r="5" fill="#2c3e50"/>' +
          "</svg>";
        return "url(\"data:image/svg+xml," + encodeURIComponent(svg) + "\")";
      }

      function progressToBottom(p) {
        return 6 + p * 0.72;
      }

      function placeKid() {
        el.kid.style.bottom = progressToBottom(state.progress) + "%";
      }

      function syncLightUi() {
        el.lampRed.className = "lamp" + (state.light === "red" ? " on-red" : "");
        el.lampYellow.className = "lamp" + (state.light === "yellow" ? " on-yellow" : "");
        el.lampGreen.className = "lamp" + (state.light === "green" ? " on-green" : "");
        el.lightLabel.className = "light-label " + state.light;
        if (state.light === "red") el.lightText.textContent = "红灯 · 停下";
        else if (state.light === "yellow") el.lightText.textContent = "黄灯 · 停下";
        else el.lightText.textContent = "绿灯 · 可以走";
        el.secRed.textContent = "";
        el.secYellow.textContent = "";
        el.secGreen.textContent = "";
        state.shownSec = -1;
      }

      function activeSecEl() {
        if (state.light === "red") return el.secRed;
        if (state.light === "yellow") return el.secYellow;
        return el.secGreen;
      }

      function updateCountdown(now) {
        const left = Math.max(0, state.lightUntil - now);
        const sec = Math.max(1, Math.ceil(left / 1000));
        const show = left <= 0 ? 1 : sec;
        if (show === state.shownSec) return;
        state.shownSec = show;
        const node = activeSecEl();
        el.secRed.textContent = "";
        el.secYellow.textContent = "";
        el.secGreen.textContent = "";
        node.textContent = String(show);
      }

      function setLight(next, now) {
        state.light = next;
        const c = cfg();
        const dur =
          next === "green" ? pickDur(c.green) :
          next === "yellow" ? pickDur(c.yellow) :
          pickDur(c.red);
        state.lightUntil = now + dur;
        if (next === "red") state.redStreak += 1;
        else state.redStreak = 0;
        syncLightUi();
        updateCountdown(now);
        if (state.phase === "play" && !state.lock) {
          if (next === "green") setStatus("绿灯了！按住按钮走过去。");
          else if (next === "yellow") setStatus("黄灯了，快停在斑马线上或退回人行道。");
          else setStatus("红灯！停在人行道，等绿灯。");
        }
      }

      function nextLight(now) {
        if (state.light === "green") {
          setLight("yellow", now);
        } else if (state.light === "yellow") {
          setLight("red", now);
        } else {
          // 偶尔连着多段红灯，再变绿
          const maxStreak = state.hard ? 1 : 2;
          const chance = state.hard ? 0.18 : 0.28;
          if (state.redStreak < maxStreak && Math.random() < chance) setLight("red", now);
          else setLight("green", now);
        }
      }

      function clearCars() {
        state.cars = [];
        el.cars.innerHTML = "";
      }

      function scheduleSpawn(now) {
        const c = cfg();
        state.spawnAt = now + pickDur(c.spawn);
      }

      function spawnCar(now) {
        const c = cfg();
        const node = document.createElement("div");
        node.className = "traffic-car";
        const color = CAR_COLORS[randInt(0, CAR_COLORS.length - 1)];
        node.style.backgroundImage = carBg(color);
        const lane = Math.random() < 0.5 ? -12 : 12;
        node.style.marginTop = lane - 18 + "px";
        const dir = Math.random() < 0.5 ? 1 : -1;
        const w = el.scene.clientWidth || 600;
        const x = dir === 1 ? -90 : w + 20;
        if (dir === -1) node.style.transform = "scaleX(-1)";
        el.cars.appendChild(node);
        state.cars.push({
          el: node,
          x: x,
          dir: dir,
          speed: pickDur(c.carSpeed),
        });
        // 有时紧挨着再来一辆
        if (Math.random() < 0.22) state.spawnAt = now + rand(280, 650);
        else scheduleSpawn(now);
      }

      function onRoad() {
        return state.progress > 12 && state.progress < 88;
      }

      function fail(msg) {
        if (state.phase !== "play") return;
        state.phase = "lose";
        state.holding = false;
        state.lock = true;
        el.walk.classList.remove("holding");
        el.walk.disabled = true;
        el.kid.classList.remove("walk-bounce");
        el.kid.classList.add("hit");
        setStatus(msg, "bad");
        setTimeout(function () {
          el.kid.classList.remove("hit");
          resetRound(false);
        }, 1100);
      }

      function win() {
        if (state.phase !== "play") return;
        state.phase = "win";
        state.holding = false;
        state.lock = true;
        state.progress = 100;
        placeKid();
        el.walk.classList.remove("holding");
        el.walk.disabled = true;
        el.kid.classList.remove("walk-bounce");
        state.ok += 1;
        el.ok.textContent = String(state.ok);
        setStatus("到对面啦！过马路真安全。", "ok");
        setTimeout(function () {
          if (state.ok > 0 && state.ok % 8 === 0) {
            setStatus("连续安全到达！你真会看红绿灯。", "ok");
          }
          resetRound(false);
        }, 1100);
      }

      function resetRound(countTry) {
        state.phase = "play";
        state.lock = false;
        state.progress = 0;
        state.holding = false;
        state.redWarn = false;
        state.yellowWarn = false;
        state.redStreak = 0;
        placeKid();
        el.walk.disabled = false;
        el.walk.classList.remove("holding");
        el.kid.classList.remove("walk-bounce", "hit");
        clearCars();
        const now = performance.now();
        state.lastTs = now;
        scheduleSpawn(now);
        // 多数从红灯开始，偶尔开局就是绿灯
        if (Math.random() < 0.22) setLight("green", now);
        else setLight("red", now);
        if (countTry) {
          state.try += 1;
          el.try.textContent = String(state.try);
        }
        el.ask.textContent = cfg().ask;
        if (state.light === "green") setStatus("运气好，开局绿灯！按住走过去。");
        else setStatus("红灯先看车，等绿灯再按住走。");
      }

      function tick(ts) {
        if (!state.lastTs) state.lastTs = ts;
        const dt = Math.min(0.05, (ts - state.lastTs) / 1000);
        state.lastTs = ts;
        const c = cfg();

        if (state.phase === "play" && ts >= state.lightUntil) nextLight(ts);
        updateCountdown(ts);

        const carsRun = state.light === "red" || state.light === "yellow";
        if (state.phase === "play" && carsRun && ts >= state.spawnAt) spawnCar(ts);

        const limit = el.scene.clientWidth + 120;
        for (let i = state.cars.length - 1; i >= 0; i--) {
          const car = state.cars[i];
          if (carsRun || state.phase !== "play") {
            car.x += car.dir * car.speed * dt;
          }
          const flip = car.dir === -1 ? " scaleX(-1)" : "";
          car.el.style.transform = "translateX(" + car.x + "px)" + flip;
          if ((car.dir === 1 && car.x > limit) || (car.dir === -1 && car.x < -120)) {
            car.el.remove();
            state.cars.splice(i, 1);
          }
        }

        if (state.phase === "play" && state.holding) {
          if (state.light === "green") {
            state.redWarn = false;
            state.yellowWarn = false;
            state.progress = Math.min(100, state.progress + c.walkSpeed * dt);
            placeKid();
            el.kid.classList.add("walk-bounce");
            if (state.progress >= 100) win();
          } else if (state.light === "yellow") {
            if (onRoad()) {
              fail("黄灯了还在走，下次黄灯要停下。");
            } else if (!state.yellowWarn) {
              state.yellowWarn = true;
              setStatus("黄灯闪了，先松手停下，等下一轮绿灯。", "bad");
            }
          } else if (state.light === "red") {
            if (onRoad() || state.progress > 2) fail("红灯不能走！回到人行道再等绿灯。");
            else if (!state.redWarn) {
              state.redWarn = true;
              setStatus("红灯呢，先松手等一等。", "bad");
            }
          }
        } else {
          el.kid.classList.remove("walk-bounce");
        }

        if (state.phase === "play" && !state.holding && state.light === "red" && onRoad()) {
          fail("红灯亮了，还站在马路中间哦。");
        }

        requestAnimationFrame(tick);
      }

      function holdStart(ev) {
        if (state.lock || state.phase !== "play") return;
        ev.preventDefault();
        state.holding = true;
        el.walk.classList.add("holding");
        if (state.try === 0) {
          state.try = 1;
          el.try.textContent = "1";
        }
      }
      function holdEnd() {
        state.holding = false;
        el.walk.classList.remove("holding");
      }

      el.walk.addEventListener("pointerdown", holdStart);
      window.addEventListener("pointerup", holdEnd);
      window.addEventListener("pointercancel", holdEnd);
      el.walk.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });

      document.getElementById("easy").onclick = function () {
        state.hard = false;
        this.classList.add("active");
        document.getElementById("hard").classList.remove("active");
        state.ok = 0;
        state.try = 0;
        el.ok.textContent = "0";
        el.try.textContent = "0";
        resetRound(false);
      };
      document.getElementById("hard").onclick = function () {
        state.hard = true;
        this.classList.add("active");
        document.getElementById("easy").classList.remove("active");
        state.ok = 0;
        state.try = 0;
        el.ok.textContent = "0";
        el.try.textContent = "0";
        resetRound(false);
      };
      document.getElementById("reset").onclick = function () {
        resetRound(true);
      };

      resetRound(false);
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
