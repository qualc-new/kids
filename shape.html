<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>找形状</title>
  <style>
    :root {
      --bg: #ffffff; --paper: #f4f8fc; --ink: #2c3e50; --muted: #6b7c8f;
      --line: #c5d5e8; --red: #ff7a1a; --ok: #2bb673; --btn-ink: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 6%, #e3f0ff 0, transparent 26%),
        radial-gradient(circle at 92% 10%, #dff0ff 0, transparent 24%),
        radial-gradient(circle at 80% 95%, #fff3c9 0, transparent 28%),
        var(--bg);
      padding: 20px 16px 32px;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    a.home { color: var(--muted); font-size: 14px; }
    h1 { margin: 8px 0 6px; font-size: 28px; }
    .lead { margin: 0 0 14px; color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip, button {
      border: 3px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      border-radius: 999px;
      font: inherit;
      cursor: pointer;
      padding: 7px 14px;
    }
    .chip.active { background: var(--red); border-color: var(--red); color: var(--btn-ink); }
    .stats { display: flex; gap: 20px; margin: 8px 0 14px; }
    .stat b { display: block; font-size: 26px; }
    .stat span { color: var(--muted); font-size: 13px; }
    .stage {
      background: var(--paper);
      border: 3px solid var(--line);
      border-radius: 24px;
      padding: 18px 16px 20px;
    }
    .ask { margin: 0 0 14px; font-size: 20px; font-weight: 700; }
    .target {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      min-height: 110px;
      padding: 12px;
      background: #eef5fb;
      border-radius: 18px;
      margin-bottom: 16px;
    }
    .target .label { font-size: 18px; font-weight: 700; }
    .choices {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .choice {
      width: 100px;
      height: 100px;
      border-radius: 24px;
      border: 3px solid var(--line);
      background: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .choice.ok { border-color: var(--ok); background: #eef8f1; }
    .choice.bad { border-color: var(--red); background: #fdeeee; }
    .status { margin: 14px 0 0; color: var(--muted); min-height: 22px; }

    a.home {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: #fff;
      border: 2px solid var(--line);
      color: var(--red);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    h1 { color: var(--red); font-weight: 800; letter-spacing: 0.5px; }
    .chip, button {
      font-weight: 700;
      padding: 9px 16px;
      background: #fff;
      box-shadow: 0 4px 0 #b8cce0;
    }
    .chip.active, button.primary {
      box-shadow: 0 4px 0 #d9650a;
    }
    .chip:active, button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #b8cce0;
    }
    .stat b { color: var(--red); font-weight: 800; }
    .ask { font-weight: 800; color: var(--ink); }
    .stage { box-shadow: 0 8px 0 #d4e4f7; background: #fff; }
    .num, .choice, .tile, .btns button {
      box-shadow: 0 5px 0 #b8cce0;
      font-weight: 800;
    }
    .num:active, .choice:active, .btns button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #b8cce0;
    }
    .status { font-size: 15px; font-weight: 600; }

    .car-deco {
      position: fixed; width: 64px; height: 40px; pointer-events: none; opacity: 0.85; z-index: 0;
    }
    .car-deco-tl { top: 10px; left: 8px; }
    .car-deco-tr { top: 14px; right: 10px; transform: scaleX(-1); }
    .wrap { position: relative; z-index: 1; }
    .road-line {
      height: 7px; margin: 0 0 12px; border-radius: 999px;
      background: repeating-linear-gradient(90deg, #ffd166 0 12px, transparent 12px 22px), #4a5568;
      border: 2px solid #4a5568;
    }
    a.home {
      display: inline-flex !important; align-items: center; gap: 6px;
    }
    .stage { position: relative; }
    .stage::before, .stage::after {
      content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%;
      background: #2c3e50; border: 3px solid #94a3b8; z-index: 2; bottom: 8px;
    }
    .stage::before { left: 8px; }
    .stage::after { right: 8px; }
  </style>
</head>
<body>
  <svg class="car-deco car-deco-tl" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="16" width="52" height="14" rx="5" fill="#1e88e5"/><path d="M14 16l7-9h20l9 9z" fill="#1e88e5"/><circle cx="20" cy="31" r="5" fill="#2c3e50"/><circle cx="44" cy="31" r="5" fill="#2c3e50"/></svg>
  <svg class="car-deco car-deco-tr" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="14" width="44" height="16" rx="3" fill="#ff7a1a"/><rect x="12" y="8" width="22" height="8" rx="2" fill="#ff9a4d"/><circle cx="18" cy="32" r="5" fill="#2c3e50"/><circle cx="40" cy="32" r="5" fill="#2c3e50"/><rect x="48" y="18" width="10" height="8" fill="#ffd166"/></svg>
  <div class="wrap">
    <a class="home" href="index.html"><svg width="26" height="16" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="16" width="52" height="14" rx="5" fill="#ff7a1a"/><path d="M14 16l7-9h20l9 9z" fill="#ff7a1a"/><circle cx="20" cy="31" r="5" fill="#2c3e50"/><circle cx="44" cy="31" r="5" fill="#2c3e50"/></svg> 回家园</a>
    
    <h1>找形状</h1>
    <div class="road-line" aria-hidden="true"></div>
    <p class="lead">上面是目标形状，点出一样的那个。可以想成车轮、车窗、路标。</p>
    <div class="row">
      <button type="button" class="chip active" id="easy">3 岁 · 同色同形</button>
      <button type="button" class="chip" id="hard">4～5 岁 · 只看形状</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="q">1</b><span>第几题</span></div>
      <div class="stat"><b id="ok">0</b><span>答对</span></div>
    </div>
    <div class="stage">
      <p class="ask" id="ask">找出圆形</p>
      <div class="target" id="target"></div>
      <div class="choices" id="choices"></div>
      <p class="status" id="status">先看上面的样子，再在下面找一样的。</p>
    </div>
  </div>
  <script>
    (function () {
      const SHAPES = [
        { id: "circle", name: "圆形（车轮）" },
        { id: "square", name: "方形（车窗）" },
        { id: "tri", name: "三角形（路标）" },
        { id: "star", name: "星星" },
      ];
      const COLORS = ["#ff7a1a", "#6bb6ff", "#ffd166", "#2bb673"];
      const state = { hard: false, ans: "circle", correct: 0, q: 1, lock: false };

      function rand(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
      function shuffle(a) {
        const arr = a.slice();
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
      }
      function mark(shape, color, size) {
        size = size || 56;
        if (shape === "circle") {
          return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="' + color + '"/></svg>';
        }
        if (shape === "square") {
          return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 100 100"><rect x="14" y="14" width="72" height="72" rx="8" fill="' + color + '"/></svg>';
        }
        if (shape === "tri") {
          return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 100 100"><polygon points="50,12 88,86 12,86" fill="' + color + '"/></svg>';
        }
        return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 100 100"><polygon points="50,8 60,38 92,38 66,58 76,90 50,70 24,90 34,58 8,38 40,38" fill="' + color + '"/></svg>';
      }
      function nextQ() {
        state.lock = false;
        const pool = state.hard ? SHAPES : SHAPES.slice(0, 3);
        const target = pool[rand(0, pool.length - 1)];
        state.ans = target.id;
        const targetColor = COLORS[rand(0, COLORS.length - 1)];
        document.getElementById("ask").textContent = "找出" + target.name;
        document.getElementById("target").innerHTML =
          '<span class="label">样子：</span>' + mark(target.id, targetColor, 72);
        const others = pool.filter(function (s) { return s.id !== target.id; });
        const opts = [{ id: target.id, color: state.hard ? COLORS[rand(0, COLORS.length - 1)] : targetColor }];
        others.forEach(function (s) {
          opts.push({
            id: s.id,
            color: state.hard ? COLORS[rand(0, COLORS.length - 1)] : targetColor,
          });
        });
        while (opts.length < (state.hard ? 4 : 3)) {
          const extra = pool[rand(0, pool.length - 1)];
          if (!opts.some(function (o) { return o.id === extra.id; })) {
            opts.push({ id: extra.id, color: COLORS[rand(0, COLORS.length - 1)] });
          } else break;
        }
        const box = document.getElementById("choices");
        box.innerHTML = "";
        shuffle(opts).forEach(function (o) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "choice";
          b.innerHTML = mark(o.id, o.color, 64);
          b.onclick = function () { pick(o.id, b); };
          box.appendChild(b);
        });
        document.getElementById("q").textContent = String(state.q);
        document.getElementById("ok").textContent = String(state.correct);
        document.getElementById("status").textContent = state.hard
          ? "颜色可能不一样，只看形状。"
          : "找出和上面一样的形状。";
      }
      function pick(id, btn) {
        if (state.lock) return;
        if (id === state.ans) {
          state.lock = true;
          btn.classList.add("ok");
          state.correct += 1;
          document.getElementById("ok").textContent = String(state.correct);
          document.getElementById("status").textContent = "对了！就是这个形状。";
          setTimeout(function () {
            state.q += 1;
            if (state.correct >= 8) { state.correct = 0; state.q = 1; }
            nextQ();
          }, 900);
        } else {
          btn.classList.add("bad");
          document.getElementById("status").textContent = "再看看上面的样子。";
          setTimeout(function () { btn.classList.remove("bad"); }, 450);
        }
      }
      document.getElementById("easy").onclick = function () {
        state.hard = false; state.correct = 0; state.q = 1;
        this.classList.add("active");
        document.getElementById("hard").classList.remove("active");
        nextQ();
      };
      document.getElementById("hard").onclick = function () {
        state.hard = true; state.correct = 0; state.q = 1;
        this.classList.add("active");
        document.getElementById("easy").classList.remove("active");
        nextQ();
      };
      nextQ();
    })();
  </script>
</body>
</html>
