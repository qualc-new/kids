<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>谁更大</title>
  <style>
    :root {
      --bg: #ffffff; --paper: #f4f8fc; --ink: #2c3e50; --muted: #6b7c8f;
      --line: #c5d5e8; --red: #ff7a1a; --ok: #2bb673; --btn-ink: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 6%, #e3f0ff 0, transparent 26%),
        radial-gradient(circle at 92% 10%, #dff0ff 0, transparent 24%),
        radial-gradient(circle at 80% 95%, #fff3c9 0, transparent 28%),
        var(--bg);
      padding: 20px 16px 32px;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    a.home { color: var(--muted); font-size: 14px; }
    h1 { margin: 8px 0 6px; font-size: 28px; }
    .lead { margin: 0 0 14px; color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip, button {
      border: 3px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      border-radius: 999px;
      font: inherit;
      cursor: pointer;
      padding: 7px 14px;
    }
    .chip.active { background: var(--red); border-color: var(--red); color: var(--btn-ink); }
    .stats { display: flex; gap: 20px; margin: 8px 0 14px; }
    .stat b { display: block; font-size: 26px; }
    .stat span { color: var(--muted); font-size: 13px; }
    .stage {
      background: var(--paper);
      border: 3px solid var(--line);
      border-radius: 24px;
      padding: 18px 16px 20px;
    }
    .ask { margin: 0 0 14px; font-size: 20px; font-weight: 700; }
    .sides {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      min-height: 200px;
    }
    .side {
      background: #eef5fb;
      border-radius: 18px;
      border: 3px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      cursor: pointer;
    }
    .side:hover { border-color: #ffd166; }
    .side.ok { border-color: var(--ok); background: #eef8f1; }
    .side.bad { border-color: var(--red); background: #fdeeee; }
    .side h3 { margin: 0; font-size: 15px; }
    .shape { display: block; }
    .btns { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .btns button {
      min-width: 120px;
      height: 52px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      background: #fff;
    }
    .btns button.ok { border-color: var(--ok); background: #eef8f1; }
    .btns button.bad { border-color: var(--red); background: #fdeeee; }
    .status { margin: 14px 0 0; color: var(--muted); min-height: 22px; }

    a.home {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: #fff;
      border: 2px solid var(--line);
      color: var(--red);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    h1 { color: var(--red); font-weight: 800; letter-spacing: 0.5px; }
    .chip, button {
      font-weight: 700;
      padding: 9px 16px;
      background: #fff;
      box-shadow: 0 4px 0 #b8cce0;
    }
    .chip.active, button.primary {
      box-shadow: 0 4px 0 #d9650a;
    }
    .chip:active, button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #b8cce0;
    }
    .stat b { color: var(--red); font-weight: 800; }
    .ask { font-weight: 800; color: var(--ink); }
    .stage { box-shadow: 0 8px 0 #d4e4f7; background: #fff; }
    .num, .choice, .tile, .btns button {
      box-shadow: 0 5px 0 #b8cce0;
      font-weight: 800;
    }
    .num:active, .choice:active, .btns button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #b8cce0;
    }
    .status { font-size: 15px; font-weight: 600; }

    .car-deco {
      position: fixed; width: 64px; height: 40px; pointer-events: none; opacity: 0.85; z-index: 0;
    }
    .car-deco-tl { top: 10px; left: 8px; }
    .car-deco-tr { top: 14px; right: 10px; transform: scaleX(-1); }
    .wrap { position: relative; z-index: 1; }
    .road-line {
      height: 7px; margin: 0 0 12px; border-radius: 999px;
      background: repeating-linear-gradient(90deg, #ffd166 0 12px, transparent 12px 22px), #4a5568;
      border: 2px solid #4a5568;
    }
    a.home {
      display: inline-flex !important; align-items: center; gap: 6px;
    }
    .stage { position: relative; }
    .stage::before, .stage::after {
      content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%;
      background: #2c3e50; border: 3px solid #94a3b8; z-index: 2; bottom: 8px;
    }
    .stage::before { left: 8px; }
    .stage::after { right: 8px; }
  </style>
</head>
<body>
  <svg class="car-deco car-deco-tl" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="16" width="52" height="14" rx="5" fill="#1e88e5"/><path d="M14 16l7-9h20l9 9z" fill="#1e88e5"/><circle cx="20" cy="31" r="5" fill="#2c3e50"/><circle cx="44" cy="31" r="5" fill="#2c3e50"/></svg>
  <svg class="car-deco car-deco-tr" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="14" width="44" height="16" rx="3" fill="#ff7a1a"/><rect x="12" y="8" width="22" height="8" rx="2" fill="#ff9a4d"/><circle cx="18" cy="32" r="5" fill="#2c3e50"/><circle cx="40" cy="32" r="5" fill="#2c3e50"/><rect x="48" y="18" width="10" height="8" fill="#ffd166"/></svg>
  <div class="wrap">
    <a class="home" href="index.html"><svg width="26" height="16" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="16" width="52" height="14" rx="5" fill="#ff7a1a"/><path d="M14 16l7-9h20l9 9z" fill="#ff7a1a"/><circle cx="20" cy="31" r="5" fill="#2c3e50"/><circle cx="44" cy="31" r="5" fill="#2c3e50"/></svg> 回家园</a>
    
    <h1>谁更大</h1>
    <div class="road-line" aria-hidden="true"></div>
    <p class="lead">大卡车和小轿车，谁更大？也可以练「一样大」。</p>
    <div class="row">
      <button type="button" class="chip active" id="easy">3 岁 · 差得明显</button>
      <button type="button" class="chip" id="hard">4～5 岁 · 含一样大</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="q">1</b><span>第几题</span></div>
      <div class="stat"><b id="ok">0</b><span>答对</span></div>
    </div>
    <div class="stage">
      <p class="ask" id="ask">哪个更大？</p>
      <div class="sides">
        <div class="side" id="left" data-side="left"><h3>左边</h3></div>
        <div class="side" id="right" data-side="right"><h3>右边</h3></div>
      </div>
      <div class="btns" id="btns"></div>
      <p class="status" id="status">用眼睛比一比，谁占的地方更大。</p>
    </div>
  </div>
  <script>
    (function () {
      const COLORS = ["#ff7a1a", "#6bb6ff", "#ffd166", "#2bb673"];
      const state = { hard: false, ans: "left", left: 90, right: 48, shape: "circle", color: COLORS[0], correct: 0, q: 1, lock: false };

      function rand(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
      function svg(size, shape, color) {
        const w = Math.round(size * 1.35);
        const h = Math.round(size * 0.85);
        return '<svg class="shape" width="' + w + '" height="' + h + '" viewBox="0 0 64 40"><rect x="6" y="16" width="52" height="14" rx="5" fill="' + color + '"/><path d="M14 16l7-9h20l9 9z" fill="' + color + '"/><circle cx="20" cy="31" r="5.5" fill="#2c3e50"/><circle cx="44" cy="31" r="5.5" fill="#2c3e50"/><rect x="22" y="9" width="10" height="7" rx="1.5" fill="#dbeafe"/><rect x="34" y="9" width="10" height="7" rx="1.5" fill="#dbeafe"/></svg>';
      }
      function nextQ() {
        state.lock = false;
        state.shape = "car";
        state.color = COLORS[rand(0, COLORS.length - 1)];
        if (!state.hard) {
          const big = rand(88, 110);
          const small = rand(36, 52);
          if (Math.random() < 0.5) {
            state.left = big; state.right = small; state.ans = "left";
          } else {
            state.left = small; state.right = big; state.ans = "right";
          }
          document.getElementById("ask").textContent = "哪辆车更大？";
        } else {
          const mode = rand(0, 2);
          if (mode === 0) {
            const s = rand(60, 80);
            state.left = s; state.right = s; state.ans = "same";
            document.getElementById("ask").textContent = "哪辆车更大？还是一样大？";
          } else {
            const big = rand(86, 108);
            const small = rand(42, 58);
            if (Math.random() < 0.5) {
              state.left = big; state.right = small; state.ans = "left";
            } else {
              state.left = small; state.right = big; state.ans = "right";
            }
            document.getElementById("ask").textContent = "哪辆车更大？还是一样大？";
          }
        }
        const left = document.getElementById("left");
        const right = document.getElementById("right");
        left.className = "side";
        right.className = "side";
        left.innerHTML = "<h3>左边</h3>" + svg(state.left, state.shape, state.color);
        right.innerHTML = "<h3>右边</h3>" + svg(state.right, state.shape, state.color);
        document.getElementById("q").textContent = String(state.q);
        document.getElementById("ok").textContent = String(state.correct);
        document.getElementById("status").textContent = "点更大的一边，或点下面的按钮。";
        drawBtns();
      }
      function drawBtns() {
        const box = document.getElementById("btns");
        const opts = [
          { id: "left", label: "左边大" },
          { id: "same", label: "一样大" },
          { id: "right", label: "右边大" },
        ];
        const show = state.hard ? opts : opts.filter(function (o) { return o.id !== "same"; });
        box.innerHTML = "";
        show.forEach(function (o) {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = o.label;
          b.onclick = function () { pick(o.id, b); };
          box.appendChild(b);
        });
      }
      function pick(id, btn) {
        if (state.lock) return;
        const left = document.getElementById("left");
        const right = document.getElementById("right");
        if (id === state.ans) {
          state.lock = true;
          if (btn) btn.classList.add("ok");
          if (id === "left") left.classList.add("ok");
          if (id === "right") right.classList.add("ok");
          if (id === "same") { left.classList.add("ok"); right.classList.add("ok"); }
          state.correct += 1;
          document.getElementById("ok").textContent = String(state.correct);
          document.getElementById("status").textContent =
            id === "same" ? "对了！两边一样大。" : "对了！这一边更大。";
          setTimeout(function () {
            state.q += 1;
            if (state.correct >= 8) { state.correct = 0; state.q = 1; }
            nextQ();
          }, 900);
        } else {
          if (btn) btn.classList.add("bad");
          if (id === "left") left.classList.add("bad");
          if (id === "right") right.classList.add("bad");
          document.getElementById("status").textContent = "再比一比，谁占的地方更大。";
          setTimeout(function () {
            if (btn) btn.classList.remove("bad");
            left.classList.remove("bad");
            right.classList.remove("bad");
          }, 450);
        }
      }
      document.getElementById("left").onclick = function () { if (!state.hard || state.ans !== "same") pick("left"); };
      document.getElementById("right").onclick = function () { if (!state.hard || state.ans !== "same") pick("right"); };
      document.getElementById("easy").onclick = function () {
        state.hard = false; state.correct = 0; state.q = 1;
        this.classList.add("active");
        document.getElementById("hard").classList.remove("active");
        nextQ();
      };
      document.getElementById("hard").onclick = function () {
        state.hard = true; state.correct = 0; state.q = 1;
        this.classList.add("active");
        document.getElementById("easy").classList.remove("active");
        nextQ();
      };
      nextQ();
    })();
  </script>
</body>
</html>
