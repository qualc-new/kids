<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>平均分：分苹果</title>
  <style>
    :root {
      --bg: #ffffff;
      --paper: #f4f8fc;
      --ink: #2c3e50;
      --muted: #6b7c8f;
      --line: #c5d5e8;
      --red: #ff7a1a;
      --green: #2bb673;
      --btn: #ff7a1a;
      --btn-ink: #fff;
      --ok: #2bb673;
      --warn: #ffb347;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 6%, #e3f0ff 0, transparent 26%),
        radial-gradient(circle at 92% 10%, #dff0ff 0, transparent 24%),
        radial-gradient(circle at 80% 95%, #fff3c9 0, transparent 28%),
        var(--bg);
      padding: 20px 16px 32px;
    }
    .wrap { max-width: 980px; margin: 0 auto; }
    a.home {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: #fff;
      border: 2px solid var(--line);
      color: var(--red);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    h1 { margin: 8px 0 6px; font-size: 30px; font-weight: 800; color: var(--red); letter-spacing: 0.5px; }
    .lead { margin: 0 0 16px; color: var(--muted); font-size: 15px; line-height: 1.5; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    .chip, button, .stepper {
      border: 3px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 0 #b8cce0;
    }
    .chip, button { padding: 9px 16px; }
    .chip.active, button.primary {
      background: var(--btn);
      border-color: var(--btn);
      color: var(--btn-ink);
      box-shadow: 0 4px 0 #d9650a;
    }
    button.ghost { background: #fff; }
    button:disabled, .chip:disabled { opacity: 0.45; cursor: not-allowed; }
    .stepper {
      display: inline-flex;
      align-items: center;
      padding: 4px;
      gap: 2px;
    }
    .stepper span { min-width: 76px; text-align: center; font-size: 14px; font-weight: 700; }
    .stepper button {
      width: 36px;
      height: 36px;
      padding: 0;
      border: 0;
      background: #e3f0ff;
      box-shadow: none;
    }
    .stats { display: flex; gap: 18px; flex-wrap: wrap; margin: 8px 0 14px; }
    .stat b { display: block; font-size: 28px; line-height: 1.1; color: var(--red); font-weight: 800; }
    .stat span { color: var(--muted); font-size: 13px; }
    .stage-card {
      background: #fff;
      border: 3px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 8px 0 #d4e4f7;
    }
    canvas {
      display: block;
      width: 100%;
      height: 520px;
      touch-action: none;
      cursor: default;
    }
    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 14px 16px;
      border-top: 3px solid var(--line);
      background: #f4f8fc;
    }
    .status {
      margin: 0;
      flex: 1;
      min-width: 200px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.45;
    }
    .formula {
      display: none;
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: 18px;
      background: #e8fff5;
      border: 3px solid #8fd9b5;
      color: var(--ok);
      font-size: 16px;
      font-weight: 700;
    }
    .formula.show { display: block; }
    .formula.warn { background: #fff8e6; border-color: #ffd166; color: #c98a00; }

    /* 小汽车主题装饰：不改玩法，只点缀界面 */
    .car-deco {
      position: fixed;
      width: 72px;
      height: 44px;
      pointer-events: none;
      opacity: 0.9;
      z-index: 0;
    }
    .car-deco-tl { top: 12px; left: 10px; }
    .car-deco-tr { top: 16px; right: 12px; transform: scaleX(-1); }
    .car-deco-bl { bottom: 14px; left: 12px; opacity: 0.55; }
    .car-deco-br { bottom: 18px; right: 14px; opacity: 0.55; transform: scaleX(-1); }
    .wrap { position: relative; z-index: 1; }
    .page-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .page-head h1 { margin: 0; flex: 1; min-width: 200px; }
    .title-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #fff;
      border: 2px solid var(--line);
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }
    .road-line {
      height: 8px;
      margin: 0 0 14px;
      border-radius: 999px;
      background:
        repeating-linear-gradient(90deg, #ffd166 0 14px, transparent 14px 24px),
        #4a5568;
      border: 2px solid #4a5568;
    }
    a.home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    a.home svg, .btn-ico, .title-badge svg { display: block; flex-shrink: 0; }
    button.primary, .chip.active {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .stage-card { position: relative; }
    .stage-card::before,
    .stage-card::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #2c3e50;
      border: 3px solid #94a3b8;
      z-index: 2;
    }
    .stage-card::before { left: 10px; bottom: 10px; }
    .stage-card::after { right: 10px; bottom: 10px; }
    .stat {
      background: #fff;
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 8px 12px;
      min-width: 72px;
    }
  </style>
</head>
<body>
  <svg class="car-deco car-deco-tl" viewBox="0 0 72 44" aria-hidden="true"><rect x="8" y="18" width="56" height="14" rx="4" fill="#1e88e5"/><path d="M16 18l8-10h22l10 10z" fill="#1e88e5"/><circle cx="22" cy="33" r="6" fill="#2c3e50"/><circle cx="50" cy="33" r="6" fill="#2c3e50"/><rect x="26" y="10" width="12" height="7" rx="1" fill="#dbeafe"/><rect x="40" y="10" width="12" height="7" rx="1" fill="#dbeafe"/></svg>
  <svg class="car-deco car-deco-tr" viewBox="0 0 72 44" aria-hidden="true"><rect x="6" y="16" width="50" height="16" rx="3" fill="#ff7a1a"/><rect x="10" y="8" width="28" height="10" rx="2" fill="#ff9a4d"/><circle cx="20" cy="34" r="6" fill="#2c3e50"/><circle cx="48" cy="34" r="6" fill="#2c3e50"/><rect x="40" y="18" width="12" height="8" fill="#ffd166"/></svg>
  <svg class="car-deco car-deco-bl" viewBox="0 0 72 44" aria-hidden="true"><rect x="10" y="20" width="48" height="12" rx="3" fill="#2bb673"/><path d="M18 20l6-8h20l8 8z" fill="#2bb673"/><circle cx="24" cy="33" r="5" fill="#2c3e50"/><circle cx="48" cy="33" r="5" fill="#2c3e50"/></svg>
  <svg class="car-deco car-deco-br" viewBox="0 0 72 44" aria-hidden="true"><rect x="8" y="14" width="40" height="18" rx="2" fill="#5b8def"/><rect x="48" y="20" width="16" height="12" fill="#ffd166"/><circle cx="20" cy="34" r="5" fill="#2c3e50"/><circle cx="40" cy="34" r="5" fill="#2c3e50"/><circle cx="56" cy="34" r="5" fill="#2c3e50"/></svg>
  <div class="wrap">
    <p style="margin:0 0 8px">
      <a class="home" href="index.html">
        <svg width="28" height="18" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="16" width="52" height="14" rx="5" fill="#ff7a1a"/><path d="M14 16l7-9h20l9 9z" fill="#ff7a1a"/><circle cx="20" cy="31" r="5" fill="#2c3e50"/><circle cx="44" cy="31" r="5" fill="#2c3e50"/></svg>
        回家园
      </a>
    </p>
    <div class="page-head">
      <h1>平均分：分苹果</h1>
      <span class="title-badge">
        <svg width="28" height="18" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="16" width="52" height="14" rx="5" fill="#1e88e5"/><path d="M14 16l7-9h20l9 9z" fill="#1e88e5"/><circle cx="20" cy="31" r="5" fill="#2c3e50"/><circle cx="44" cy="31" r="5" fill="#2c3e50"/></svg>
        玩法还是分苹果
      </span>
    </div>
    <div class="road-line" aria-hidden="true"></div>
    <p class="lead">把苹果一人一个地发给每个小朋友。每人分到的一样多；分不完的叫做余数。</p>

    <div class="row" id="presets"></div>
    <div class="row">
      <div class="stepper">
        <button type="button" id="nMinus" aria-label="少一个苹果">−</button>
        <span id="nLabel">苹果 10</span>
        <button type="button" id="nPlus" aria-label="多一个苹果">+</button>
      </div>
      <div class="stepper">
        <button type="button" id="mMinus" aria-label="少一份">−</button>
        <span id="mLabel">分成 3 份</span>
        <button type="button" id="mPlus" aria-label="多一份">+</button>
      </div>
      <button type="button" class="chip active" id="btnKids">小朋友</button>
      <button type="button" class="chip" id="btnPlates">盘子</button>
      <button type="button" class="chip active" id="btnWatch">看动画</button>
      <button type="button" class="chip" id="btnDrag">自己分</button>
    </div>

    <div class="stats">
      <div class="stat"><b id="statN">10</b><span>苹果</span></div>
      <div class="stat"><b id="statM">3</b><span>分成几份</span></div>
      <div class="stat"><b id="statEach">?</b><span>每人</span></div>
      <div class="stat"><b id="statRem">?</b><span>余数</span></div>
    </div>

    <div class="stage-card">
      <canvas id="stage" width="980" height="520"></canvas>
      <div class="bar">
        <button type="button" class="primary" id="btnMain">
          <svg class="btn-ico" width="28" height="18" viewBox="0 0 64 40" aria-hidden="true"><rect x="6" y="16" width="52" height="14" rx="5" fill="#fff"/><path d="M14 16l7-9h20l9 9z" fill="#fff"/><circle cx="20" cy="31" r="5" fill="#2c3e50"/><circle cx="44" cy="31" r="5" fill="#2c3e50"/></svg>
          <span id="btnMainLabel">分发</span>
        </button>
        <button type="button" class="ghost" id="btnReset">再来一次</button>
        <p class="status" id="status">点「分发」，苹果会一人一个地飞进盘子。</p>
      </div>
    </div>
    <div class="formula" id="formula"></div>
  </div>

  <script>
    (function () {
      const PRESETS = [
        { label: "6 ÷ 3", n: 6, m: 3 },
        { label: "8 ÷ 4", n: 8, m: 4 },
        { label: "10 ÷ 3 有余数", n: 10, m: 3 },
        { label: "12 ÷ 5 有余数", n: 12, m: 5 },
        { label: "15 ÷ 3", n: 15, m: 3 },
      ];
      const N_MIN = 2, N_MAX = 18, M_MIN = 2, M_MAX = 6;

      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d");
      const statusEl = document.getElementById("status");
      const formulaEl = document.getElementById("formula");
      const btnMain = document.getElementById("btnMain");

      const state = {
        n: 10,
        m: 3,
        mode: "watch",
        receiver: "kids",
        apples: [],
        playing: false,
        done: false,
        check: null,
        status: "点「分发」，苹果会一人一个地飞进盘子。",
        hoverPlate: null,
        drag: null,
        fly: null,
      };
      let cancelToken = 0;
      let cssW = 980;
      let cssH = 520;

      function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
      function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
      function lerp(a, b, t) { return a + (b - a) * t; }
      function quotient() { return Math.floor(state.n / state.m); }
      function remainder() { return state.n % state.m; }
      function nameOf(i) {
        return state.receiver === "kids" ? "小朋友 " + (i + 1) : "盘子 " + (i + 1);
      }

      function resetApples() {
        state.apples = Array.from({ length: state.n }, (_, id) => ({ id: id, plate: null }));
        state.playing = false;
        state.done = false;
        state.check = null;
        state.hoverPlate = null;
        state.drag = null;
        state.fly = null;
        state.status = state.mode === "watch"
          ? "点「分发」，苹果会一人一个地飞进盘子。"
          : "把苹果拖进盘子。每个盘子一样多，才叫平均分。";
        cancelToken += 1;
        render();
      }

      function counts() {
        const arr = Array.from({ length: state.m }, function () { return 0; });
        state.apples.forEach(function (a) {
          if (a.plate != null && !(state.drag && state.drag.id === a.id)) arr[a.plate] += 1;
        });
        return arr;
      }

      function leftover() {
        return state.apples.filter(function (a) {
          return a.plate == null && !(state.drag && state.drag.id === a.id) && !(state.fly && state.fly.id === a.id);
        }).length;
      }

      function layout() {
        const pad = 24;
        const pileTop = 18;
        const recY = 210;
        const plateY = cssH - 78;
        const colW = (cssW - pad * 2) / state.m;
        const receivers = [];
        for (let i = 0; i < state.m; i++) {
          const cx = pad + colW * (i + 0.5);
          receivers.push({
            i: i,
            x: pad + colW * i + 6,
            y: recY,
            w: colW - 12,
            h: cssH - recY - 16,
            cx: cx,
            kidY: recY + 36,
            plateY: plateY,
          });
        }

        const hidden = {};
        if (state.fly) hidden[state.fly.id] = true;
        if (state.drag) hidden[state.drag.id] = true;

        const pile = state.apples.filter(function (a) { return a.plate == null && !hidden[a.id]; });
        const pilePos = {};
        const maxCols = Math.min(12, Math.max(6, pile.length));
        const gap = 38;
        const startX = cssW / 2 - ((Math.min(pile.length, maxCols) - 1) * gap) / 2;
        pile.forEach(function (a, idx) {
          const col = idx % maxCols;
          const row = Math.floor(idx / maxCols);
          pilePos[a.id] = { x: startX + col * gap, y: pileTop + 52 + row * 40, r: 18 };
        });

        const platePos = {};
        receivers.forEach(function (rec) {
          const held = state.apples.filter(function (a) { return a.plate === rec.i && !hidden[a.id]; });
          const cols = held.length > 6 ? 4 : 3;
          held.forEach(function (a, idx) {
            const col = idx % cols;
            const row = Math.floor(idx / cols);
            const totalW = (Math.min(held.length, cols) - 1) * 26;
            platePos[a.id] = {
              x: rec.cx - totalW / 2 + col * 26,
              y: rec.plateY - 48 - row * 28,
              r: 14,
            };
          });
        });

        return { receivers: receivers, pilePos: pilePos, platePos: platePos, pileTop: pileTop };
      }

      function posOf(id, lay) {
        if (state.fly && state.fly.id === id) {
          const t = easeOut(state.fly.t);
          const x = lerp(state.fly.from.x, state.fly.to.x, t);
          const y = lerp(state.fly.from.y, state.fly.to.y, t) - Math.sin(state.fly.t * Math.PI) * 70;
          return { x: x, y: y, r: 18 };
        }
        if (state.drag && state.drag.id === id) {
          return { x: state.drag.x, y: state.drag.y, r: 18 };
        }
        return lay.pilePos[id] || lay.platePos[id] || null;
      }

      function drawApple(x, y, r) {
        const s = r / 16;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);
        ctx.strokeStyle = "#5a3a22";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -9);
        ctx.quadraticCurveTo(2, -15, 6, -17);
        ctx.stroke();
        ctx.fillStyle = "#3d9a5f";
        ctx.beginPath();
        ctx.ellipse(8, -13, 7, 3.4, -0.55, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#e53935";
        ctx.beginPath();
        ctx.moveTo(0, -8);
        ctx.bezierCurveTo(-15, -8, -17, 9, -7, 15);
        ctx.bezierCurveTo(-3, 19, 3, 19, 7, 15);
        ctx.bezierCurveTo(17, 9, 15, -8, 0, -8);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.28)";
        ctx.beginPath();
        ctx.ellipse(-5, -1, 2.8, 4.6, -0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawKid(x, y) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = "#f3d2b3";
        ctx.beginPath();
        ctx.arc(0, -28, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#d4a574";
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.fillStyle = "#5b8fd6";
        ctx.beginPath();
        ctx.roundRect(-12, -14, 24, 22, 6);
        ctx.fill();
        ctx.strokeStyle = "#2c3e50";
        ctx.lineWidth = 2.2;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(-6, 8);
        ctx.lineTo(-8, 20);
        ctx.moveTo(6, 8);
        ctx.lineTo(8, 20);
        ctx.stroke();
        ctx.restore();
      }

      function drawPlate(x, y, w, hot) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = hot ? "#f7e1b8" : "#e3f0ff";
        ctx.beginPath();
        ctx.ellipse(0, 6, w * 0.42, 11, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = hot ? "#ff7a1a" : "#9ec5ea";
        ctx.lineWidth = hot ? 2.4 : 1.6;
        ctx.beginPath();
        ctx.ellipse(0, 2, w * 0.42, 11, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        cssW = rect.width;
        cssH = rect.height;
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        render();
      }

      function render() {
        const lay = layout();
        ctx.clearRect(0, 0, cssW, cssH);

        ctx.fillStyle = "#f4f8fc";
        ctx.fillRect(0, 0, cssW, cssH);

        ctx.fillStyle = "#eef5fb";
        roundRect(16, 12, cssW - 32, 118, 12);
        ctx.fill();
        ctx.fillStyle = "#6b7c8f";
        ctx.font = "13px Microsoft YaHei, sans-serif";
        ctx.fillText(leftover() === 0 ? "苹果已经全部分出去了" : "还没分的苹果", 28, 34);
        if ((state.done || state.check === "ok") && remainder() > 0) {
          ctx.fillText("余数留在这里", cssW - 118, 34);
        }

        lay.receivers.forEach(function (rec) {
          const hot = state.hoverPlate === rec.i;
          ctx.fillStyle = hot ? "#e3f0ff" : "#f4f8fc";
          roundRect(rec.x, rec.y, rec.w, rec.h, 12);
          ctx.fill();
          ctx.strokeStyle = hot ? "#ff7a1a" : "#c5d5e8";
          ctx.lineWidth = hot ? 2 : 1;
          roundRect(rec.x, rec.y, rec.w, rec.h, 12);
          ctx.stroke();

          ctx.fillStyle = "#2c3e50";
          ctx.font = "bold 13px Microsoft YaHei, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(nameOf(rec.i), rec.cx, rec.y + 22);
          if (state.receiver === "kids") drawKid(rec.cx, rec.kidY + 18);
          drawPlate(rec.cx, rec.plateY, rec.w, hot);
          const nHere = counts()[rec.i];
          ctx.fillStyle = "#6b7c8f";
          ctx.font = "13px Microsoft YaHei, sans-serif";
          ctx.fillText(nHere + " 个", rec.cx, rec.plateY + 24);
          ctx.textAlign = "left";
        });

        state.apples.forEach(function (a) {
          const p = posOf(a.id, lay);
          if (p) drawApple(p.x, p.y, p.r);
        });

        syncChrome();
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
        else {
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
        }
      }

      function syncChrome() {
        document.getElementById("nLabel").textContent = "苹果 " + state.n;
        document.getElementById("mLabel").textContent = "分成 " + state.m + " 份";
        document.getElementById("statN").textContent = String(state.n);
        document.getElementById("statM").textContent = String(state.m);
        const show = (state.mode === "watch" && state.done) || state.check === "ok";
        document.getElementById("statEach").textContent = show ? String(quotient()) : "?";
        document.getElementById("statRem").textContent = show ? String(remainder()) : "?";
        statusEl.textContent = state.status;
        btnMain.querySelector("#btnMainLabel").textContent = state.mode === "watch" ? "分发" : "检查";
        btnMain.disabled = state.playing;
        document.getElementById("nMinus").disabled = state.playing || state.n <= N_MIN;
        document.getElementById("nPlus").disabled = state.playing || state.n >= N_MAX;
        document.getElementById("mMinus").disabled = state.playing || state.m <= M_MIN;
        document.getElementById("mPlus").disabled = state.playing || state.m >= M_MAX;
        document.getElementById("btnKids").classList.toggle("active", state.receiver === "kids");
        document.getElementById("btnPlates").classList.toggle("active", state.receiver === "plates");
        document.getElementById("btnWatch").classList.toggle("active", state.mode === "watch");
        document.getElementById("btnDrag").classList.toggle("active", state.mode === "drag");
        document.querySelectorAll("#presets .chip").forEach(function (el, i) {
          const p = PRESETS[i];
          el.classList.toggle("active", state.n === p.n && state.m === p.m);
        });
        const q = quotient();
        const r = remainder();
        if (state.mode === "watch" && state.done) {
          formulaEl.className = "formula show";
          formulaEl.textContent = r
            ? state.n + " ÷ " + state.m + " = " + q + " 余 " + r + "　　验算：" + state.m + " × " + q + " + " + r + " = " + state.n
            : state.n + " ÷ " + state.m + " = " + q + "　　验算：" + state.m + " × " + q + " = " + state.n;
        } else if (state.check === "ok") {
          formulaEl.className = "formula show";
          formulaEl.textContent = "对了！每人 " + q + " 个" + (r ? "，余 " + r + " 个。" : "，正好分完。");
        } else if (state.check === "too-many") {
          formulaEl.className = "formula show warn";
          formulaEl.textContent = "有的盘子拿多了。平均分时每人最多 " + q + " 个，多的请拖回去。";
        } else if (state.check === "can-round") {
          formulaEl.className = "formula show warn";
          formulaEl.textContent = "还可以再分一轮：每个盘子再放 1 个。";
        } else if (state.check === "uneven") {
          formulaEl.className = "formula show warn";
          formulaEl.textContent = "还没有平均。每个盘子里的苹果个数要相同。";
        } else {
          formulaEl.className = "formula";
          formulaEl.textContent = "";
        }
      }

      function toLocal(ev) {
        const box = canvas.getBoundingClientRect();
        return { x: ev.clientX - box.left, y: ev.clientY - box.top };
      }

      function hitApple(pt, lay) {
        let found = null;
        state.apples.forEach(function (a) {
          const p = posOf(a.id, lay);
          if (!p) return;
          const dx = pt.x - p.x, dy = pt.y - p.y;
          if (dx * dx + dy * dy <= (p.r + 4) * (p.r + 4)) found = a;
        });
        return found;
      }

      function hitPlate(pt, lay) {
        for (let i = 0; i < lay.receivers.length; i++) {
          const rec = lay.receivers[i];
          if (pt.x >= rec.x && pt.x <= rec.x + rec.w && pt.y >= rec.y && pt.y <= rec.y + rec.h) return rec.i;
        }
        return null;
      }

      function sleep(ms, token) {
        return new Promise(function (resolve) {
          const t0 = performance.now();
          function tick(now) {
            if (token !== cancelToken || now - t0 >= ms) resolve();
            else requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);
        });
      }

      function flyTo(id, plate, token) {
        const lay0 = layout();
        const from = posOf(id, lay0);
        const rec = lay0.receivers[plate];
        const to = { x: rec.cx, y: rec.plateY - 36 };
        if (!from) {
          state.apples[id].plate = plate;
          return Promise.resolve();
        }
        state.fly = { id: id, from: from, to: to, t: 0 };
        const dist = Math.hypot(to.x - from.x, to.y - from.y);
        const dur = Math.min(620, 360 + dist * 0.35);
        const t0 = performance.now();
        return new Promise(function (resolve) {
          function step(now) {
            if (token !== cancelToken) {
              state.fly = null;
              resolve();
              return;
            }
            state.fly.t = Math.min(1, (now - t0) / dur);
            render();
            if (state.fly.t < 1) requestAnimationFrame(step);
            else {
              state.apples[id].plate = plate;
              state.fly = null;
              render();
              resolve();
            }
          }
          requestAnimationFrame(step);
        });
      }

      async function playDeal() {
        if (state.playing || state.mode !== "watch") return;
        const token = ++cancelToken;
        state.apples = Array.from({ length: state.n }, (_, id) => ({ id: id, plate: null }));
        state.playing = true;
        state.done = false;
        state.check = null;
        state.status = "开始分：每一轮，每人先拿 1 个。";
        render();
        await sleep(260, token);
        let next = 0;
        const rounds = quotient();
        for (let round = 0; round < rounds; round++) {
          if (token !== cancelToken) return;
          state.status = "第 " + (round + 1) + " 轮：一人一个";
          render();
          for (let p = 0; p < state.m; p++) {
            if (token !== cancelToken) return;
            state.status = "第 " + (round + 1) + " 轮：发给" + nameOf(p);
            render();
            await flyTo(next, p, token);
            next += 1;
            await sleep(70, token);
          }
          state.status = "第 " + (round + 1) + " 轮结束，每人 " + (round + 1) + " 个";
          render();
          await sleep(380, token);
        }
        if (token !== cancelToken) return;
        if (remainder() > 0) state.status = "还剩 " + remainder() + " 个，不够再分一轮。这就是余数。";
        else state.status = "正好分完，没有剩余。";
        state.done = true;
        state.playing = false;
        render();
      }

      function judge() {
        const c = counts();
        const q = quotient();
        const left = leftover();
        const even = c.every(function (n) { return n === c[0]; });
        if (c.some(function (n) { return n > q; })) return "too-many";
        if (left >= state.m) return "can-round";
        if (!even || c[0] !== q || left !== remainder()) return "uneven";
        return "ok";
      }

      canvas.addEventListener("pointerdown", function (ev) {
        if (state.mode !== "drag" || state.playing) return;
        const pt = toLocal(ev);
        const lay = layout();
        const apple = hitApple(pt, lay);
        if (!apple) return;
        canvas.setPointerCapture(ev.pointerId);
        state.drag = { id: apple.id, x: pt.x, y: pt.y };
        state.check = null;
        state.hoverPlate = hitPlate(pt, lay);
        canvas.style.cursor = "grabbing";
        render();
      });
      canvas.addEventListener("pointermove", function (ev) {
        if (!state.drag) return;
        const pt = toLocal(ev);
        state.drag.x = pt.x;
        state.drag.y = pt.y;
        state.hoverPlate = hitPlate(pt, layout());
        render();
      });
      function endDrag(ev) {
        if (!state.drag) return;
        const pt = toLocal(ev);
        const target = hitPlate(pt, layout());
        state.apples[state.drag.id].plate = target;
        state.drag = null;
        state.hoverPlate = null;
        canvas.style.cursor = "default";
        render();
      }
      canvas.addEventListener("pointerup", endDrag);
      canvas.addEventListener("pointercancel", endDrag);

      document.getElementById("presets").innerHTML = PRESETS.map(function (p) {
        return '<button type="button" class="chip">' + p.label + "</button>";
      }).join("");
      document.querySelectorAll("#presets .chip").forEach(function (el, i) {
        el.addEventListener("click", function () {
          if (state.playing) return;
          state.n = PRESETS[i].n;
          state.m = PRESETS[i].m;
          resetApples();
        });
      });
      document.getElementById("nMinus").onclick = function () { if (!state.playing) { state.n = clamp(state.n - 1, N_MIN, N_MAX); resetApples(); } };
      document.getElementById("nPlus").onclick = function () { if (!state.playing) { state.n = clamp(state.n + 1, N_MIN, N_MAX); resetApples(); } };
      document.getElementById("mMinus").onclick = function () { if (!state.playing) { state.m = clamp(state.m - 1, M_MIN, M_MAX); resetApples(); } };
      document.getElementById("mPlus").onclick = function () { if (!state.playing) { state.m = clamp(state.m + 1, M_MIN, M_MAX); resetApples(); } };
      document.getElementById("btnKids").onclick = function () { state.receiver = "kids"; render(); };
      document.getElementById("btnPlates").onclick = function () { state.receiver = "plates"; render(); };
      document.getElementById("btnWatch").onclick = function () { if (state.playing) return; state.mode = "watch"; resetApples(); };
      document.getElementById("btnDrag").onclick = function () { if (state.playing) return; state.mode = "drag"; resetApples(); };
      btnMain.onclick = function () {
        if (state.mode === "watch") playDeal();
        else {
          state.check = judge();
          if (state.check === "ok") {
            state.status = remainder()
              ? "对了：每人 " + quotient() + " 个，余 " + remainder() + " 个。"
              : "对了：每人 " + quotient() + " 个，正好分完。";
          } else if (state.check === "too-many") {
            state.status = "有的盘子拿多了。多的要放回去。";
          } else if (state.check === "can-round") {
            state.status = "还可以再分一轮，一人一个。";
          } else {
            state.status = "还没有平均，每个盘子的数量要相同。";
          }
          render();
        }
      };
      document.getElementById("btnReset").onclick = function () { resetApples(); };

      window.addEventListener("resize", resize);
      resetApples();
      resize();
    })();
  </script>
</body>
</html>
